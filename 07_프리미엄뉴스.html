<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --border: #e2e0d8;
    --border-strong: #c8c5ba;
    --text-primary: #1c1c1a;
    --text-secondary: #5f5e5a;
    --text-muted: #96948a;
    --surface-1: #f6f5f0;
    --surface-2: #ffffff;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --success-bg: #eaf3de;
    --success-text: #3b6d11;
    --amber-bg: #faeeda;
    --amber-text: #854f0b;
    --danger-bg: #fcebeb;
    --danger-text: #a32d2d;
    --radius: 8px;

    --shell-bg: #333b49;
    --shell-bg-active: #262c38;
    --shell-text-muted: #9298a5;
    --shell-border: #454d5c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--surface-2);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--shell-bg);
    color: #fff;
    padding: 0 24px;
    height: 56px;
    flex-shrink: 0;
  }
  .app-header .brand { display: flex; align-items: center; gap: 12px; }
  .app-header .brand .logo { font-size: 19px; font-weight: 800; letter-spacing: 0.5px; }
  .app-header .brand .divider { color: var(--shell-text-muted); font-size: 14px; }
  .app-header .brand .label { font-size: 14px; color: #fff; }
  .app-header .account { display: flex; align-items: center; gap: 10px; }
  .app-header .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #7b8291;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px;
  }
  .app-header .account-name { font-size: 13px; font-weight: 600; }
  .app-header .btn-logout {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.5);
    color: #fff;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 4px;
  }
  .app-header .btn-logout:hover { background: rgba(255,255,255,0.1); }

  .app-body {
    display: flex;
    flex: 1;
  }

  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--shell-bg);
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    padding: 22px 20px;
    text-align: center;
    border-bottom: 0.5px solid var(--shell-border);
  }
  .sidebar-header .site-name { color: #fff; font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .sidebar-header .sub-label {
    color: var(--shell-text-muted);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .sidebar-nav { display: flex; flex-direction: column; }
  .sidebar-nav a {
    display: block;
    padding: 16px 20px;
    text-align: center;
    font-size: 13px;
    color: var(--shell-text-muted);
    text-decoration: none;
    border-bottom: 0.5px solid var(--shell-border);
  }
  .sidebar-nav a:hover { color: #fff; }
  .sidebar-nav a.active {
    background: var(--shell-bg-active);
    color: #fff;
    font-weight: 700;
  }

  .nav-parent-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 16px 20px;
    font-size: 13px;
    color: var(--shell-text-muted);
    border-bottom: 0.5px solid var(--shell-border);
    cursor: pointer;
  }
  .nav-parent-row:hover { color: #fff; }
  .nav-parent-row .nav-parent-link {
    color: inherit;
    font: inherit;
  }
  .nav-toggle {
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 1em;
    line-height: 1;
    padding: 0;
    transition: transform 0.2s;
  }
  .nav-toggle.open { transform: rotate(180deg); }
  .submenu {
    display: none;
    flex-direction: column;
    background: rgba(0,0,0,0.15);
  }
  .submenu.open { display: flex; }
  .submenu a {
    padding: 12px 20px;
    text-align: left;
    font-size: 12px;
    color: var(--shell-text-muted);
    text-decoration: none;
    border-bottom: none;
  }
  .submenu a:hover { color: #fff; }
  .submenu a.active {
    color: #fff;
    font-weight: 700;
    background: var(--shell-bg-active);
  }


  .main-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .main-content {
    flex: 1;
    padding: 24px 24px 24px 50px;
  }
  .content-inner { max-width: 1200px; margin: 0; }

  .app-footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    padding: 16px 0;
    border-top: 0.5px solid var(--border);
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .topbar h1 { font-size: 22px; font-weight: 700; margin: 0; }

  .filter-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
    padding: 10px 12px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-1);
  }
  .filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-bar select, .filter-bar input {
    font-family: inherit;
    font-size: 12px;
    padding: 7px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    background: var(--surface-2);
  }
  .custom-date-range { display: none; align-items: center; gap: 6px; }
  .custom-date-range.show { display: flex; }
  .custom-date-range .tilde { color: var(--text-muted); font-size: 12px; }
  .custom-date-range button { font-size: 11px; padding: 6px 10px; }

  button {
    font-family: inherit;
    font-size: 13px;
    border-radius: var(--radius);
    padding: 9px 16px;
    cursor: pointer;
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-secondary);
  }
  button:hover { background: var(--surface-1); }
  button.primary {
    background: var(--text-primary);
    color: #fff;
    border: none;
  }
  button.primary:hover { background: #333; }
  button:disabled { opacity: 0.3; cursor: not-allowed; }
  button:disabled:hover { background: var(--surface-2); }

  .table-wrap {
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  thead tr { background: var(--surface-1); text-align: left; }
  th {
    padding: 10px 10px;
    font-weight: 500;
    color: var(--text-secondary);
    font-size: 12px;
  }
  td {
    padding: 10px 10px;
    border-top: 0.5px solid var(--border);
    vertical-align: middle;
  }
  th.col-no, td.col-no { width: 48px; text-align: center; color: var(--text-muted); }
  th.col-title, td.col-title { }
  th.col-cat, td.col-cat { width: 130px; color: var(--text-secondary); }
  th.col-date, td.col-date { width: 130px; color: var(--text-muted); font-size: 12px; }
  th.col-status, td.col-status { width: 90px; }
  th.col-order, td.col-order { width: 80px; text-align: center; }

  .title-cell {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
    max-width: 100%;
    cursor: pointer;
  }
  .title-cell:hover { color: var(--accent); }

  .badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; white-space: nowrap; }
  .badge.published { background: var(--success-bg); color: var(--success-text); }
  .badge.scheduled { background: var(--accent-bg); color: var(--accent); }
  .badge.draft { background: var(--surface-1); color: var(--text-muted); border: 0.5px solid var(--border); }
  .badge.private { background: var(--danger-bg); color: var(--danger-text); }

  .order-btns { display: flex; justify-content: center; gap: 2px; }
  .order-btns button {
    width: 24px; height: 24px;
    padding: 0;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }

  .empty-row td {
    text-align: center;
    color: var(--text-muted);
    padding: 24px 0;
  }

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
  }
  .pagination button {
    width: 28px;
    height: 28px;
    padding: 0;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .pagination button.active {
    background: var(--text-primary);
    color: #fff;
    border: none;
  }
  .pagination button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .source-tabs { display: flex; gap: 8px; }
  .source-tab {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 18px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .source-tab:hover { background: var(--surface-1); }
  .source-tab.active {
    background: var(--text-primary);
    color: #fff;
    border-color: var(--text-primary);
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--surface-2);
    border-radius: 12px;
    width: 92%;
    max-width: 480px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 0.5px solid var(--border);
    font-size: 14px;
    font-weight: 500;
  }
  .modal-header button {
    border: none;
    background: none;
    font-size: 16px;
    color: var(--text-muted);
    padding: 0;
    cursor: pointer;
  }
  .modal-body {
    padding: 16px;
    overflow-y: auto;
  }
  .modal-body select, .modal-body input[type="text"], .modal-body input[type="date"] {
    font-family: inherit;
    font-size: 12px;
    padding: 7px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    width: 100%;
  }
  .modal-footer {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-top: 0.5px solid var(--border);
    gap: 8px;
  }
  .modal-search-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .modal-search-row button { white-space: nowrap; }
  .range-tilde { color: var(--text-muted); font-size: 13px; flex-shrink: 0; align-self: center; }

  .import-results { display: flex; flex-direction: column; gap: 6px; }
  .import-result-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 12px;
    cursor: pointer;
    font-size: 12px;
  }
  .import-result-item:hover { border-color: var(--accent); background: var(--accent-bg); }
  .import-result-item.selected { border-color: var(--accent); background: var(--accent-bg); }
  .import-result-item .r-title { display: block; margin-bottom: 3px; }
  .import-result-item .r-meta { font-size: 11px; color: var(--text-muted); }
  .import-empty { text-align: center; color: var(--text-muted); font-size: 12px; padding: 16px 0; }

  .import-pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
  }
  .import-pagination button {
    width: 26px;
    height: 26px;
    padding: 0;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .import-pagination button.active {
    background: var(--text-primary);
    color: #fff;
    border: none;
  }
  .import-pagination button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
</style>
</head>

    var d = new Date();
    d.setDate(d.getDate() - daysAgo);
    d.setHours(hour, min, 0, 0);

    '반포동 재건축 단지, 자전거 주차공간 의무화',
    '서초구청장, 스마트 모빌리티 해외 사례 시찰',
    '반포바이크 정류소 위치 선정 기준 공개',
    '서울시내 공유자전거 이용률 지역별 비교',
    '반포동 학부모, 통학로 자전거도로 안전 요구',
    '서초구 스마트시티 사업, 국토부 우수사례 선정',
    '자전거 공유서비스 확대에 주민 의견 엇갈려',
    '반포동 소상공인, 스마트시티 인프라 활용법 문의 늘어',
    '서초구, 반포동 이어 방배동에도 자전거 사업 확대',
    '국회, 예산안 심사 본격 착수',
    '여야, 민생법안 처리 두고 신경전',
    '수출 증가세 3개월 연속 이어져',
    '증시, 외국인 매수세에 강세',
    '폭염 계속, 온열질환 주의보 확대',
    '프로야구, 순위 경쟁 막판까지 치열'
  ];

  var TOTAL_SAMPLE = 45;
  var articles = [];
  for (var gi = 0; gi < TOTAL_SAMPLE; gi++) {
    var baseTitle = titlePool[gi % titlePool.length];
    var repeatSuffix = gi >= titlePool.length ? ' (' + (Math.floor(gi / titlePool.length) + 1) + ')' : '';
    var createdDaysAgo = gi; // 0~44일 전으로 분산 (기간 필터 시연용)
    var updatedDaysAgo = Math.max(0, createdDaysAgo - (gi % 3));
    articles.push({
      title: baseTitle + repeatSuffix,
      createdAt: fmt(createdDaysAgo, 9 + (gi % 10), (gi * 7) % 60),
      updatedAt: fmt(updatedDaysAgo, 10 + (gi % 8), (gi * 11) % 60)
    });
  }

  var tbody = document.getElementById('articleTableBody');

  function parseDate(str) {
    var parts = str.split(' ');
    var dateParts = parts[0].split('.').map(Number);
    var timeParts = (parts[1] || '00:00').split(':').map(Number);
    return new Date(dateParts[0], dateParts[1] - 1, dateParts[2], timeParts[0], timeParts[1]);
  }

  var periodSelect = document.getElementById('periodSelect');
  var customDateRange = document.getElementById('customDateRange');
  var startDateInput = document.getElementById('startDate');
  var endDateInput = document.getElementById('endDate');

  var PAGE_SIZE = 20;
  var currentPage = 1;

  periodSelect.addEventListener('change', function () {
    if (periodSelect.value === 'custom') {
      customDateRange.classList.add('show');
    } else {
      customDateRange.classList.remove('show');
      currentPage = 1;
      renderArticles();
    }
  });
  document.getElementById('btnApplyCustomDate').addEventListener('click', function () {
    if (!startDateInput.value || !endDateInput.value) {
      showToast('시작일과 종료일을 모두 선택해주세요');
      return;
    }
    currentPage = 1;
    renderArticles();
  });

  function getFilteredArticles() {
    var period = periodSelect.value;
    var now = new Date();

    return articles.filter(function (a) {
      if (period === 'all') return true;

      var created = parseDate(a.createdAt);

      if (period === 'today') {
        return created.getFullYear() === now.getFullYear() &&
               created.getMonth() === now.getMonth() &&
               created.getDate() === now.getDate();
      }
      if (period === 'week') {
        var weekAgo = new Date(now); weekAgo.setDate(now.getDate() - 7);
        return created >= weekAgo && created <= now;
      }
      if (period === 'month') {
        var monthAgo = new Date(now); monthAgo.setMonth(now.getMonth() - 1);
        return created >= monthAgo && created <= now;
      }
      if (period === 'custom') {
        if (!startDateInput.value || !endDateInput.value) return true;
        var start = new Date(startDateInput.value + 'T00:00:00');
        var end = new Date(endDateInput.value + 'T23:59:59');
        return created >= start && created <= end;
      }
      return true;
    });
  }

  function isFiltering() {
    return periodSelect.value !== 'all';
  }

  function renderArticles() {
    tbody.innerHTML = '';
    var filtered = getFilteredArticles();
    var reorderDisabled = isFiltering();

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="5">조건에 맞는 기사가 없습니다</td></tr>';
      document.getElementById('articlePagination').innerHTML = '';
      return;
    }

    var totalPages = Math.ceil(filtered.length / PAGE_SIZE);
    if (currentPage > totalPages) currentPage = totalPages;
    var startIdx = (currentPage - 1) * PAGE_SIZE;
    var pageItems = filtered.slice(startIdx, startIdx + PAGE_SIZE);

    pageItems.forEach(function (a, i) {
      var idx = startIdx + i;
      var realIdx = articles.indexOf(a);
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="col-no">' + (idx + 1) + '</td>' +
        '<td class="col-title"><span class="title-cell" data-idx="' + realIdx + '">' + a.title + '</span></td>' +
        '<td class="col-date">' + a.createdAt + '</td>' +
        '<td class="col-date">' + a.updatedAt + '</td>' +
        '<td class="col-order">' +
          '<div class="order-btns">' +
            '<button class="btn-up" data-idx="' + realIdx + '" ' + (reorderDisabled || realIdx === 0 ? 'disabled' : '') + '>▲</button>' +
            '<button class="btn-down" data-idx="' + realIdx + '" ' + (reorderDisabled || realIdx === articles.length - 1 ? 'disabled' : '') + '>▼</button>' +
          '</div>' +
        '</td>';
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll('.title-cell').forEach(function (el) {
      el.addEventListener('click', function () {
        window.location.href = '06_기사수정.html';
      });
    });

    tbody.querySelectorAll('.btn-up').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-idx'));
        if (idx === 0) return;
        var tmp = articles[idx - 1];
        articles[idx - 1] = articles[idx];
        articles[idx] = tmp;
        renderArticles();
      });
    });

    tbody.querySelectorAll('.btn-down').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-idx'));
        if (idx === articles.length - 1) return;
        var tmp = articles[idx + 1];
        articles[idx + 1] = articles[idx];
        articles[idx] = tmp;
        renderArticles();
      });
    });

    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    var pagination = document.getElementById('articlePagination');
    pagination.innerHTML = '';
    if (totalPages <= 1) return;

    var prevBtn = document.createElement('button');
    prevBtn.textContent = '‹';
    prevBtn.disabled = currentPage === 1;
    prevBtn.addEventListener('click', function () { currentPage -= 1; renderArticles(); });
    pagination.appendChild(prevBtn);

    for (var p = 1; p <= totalPages; p++) {
      (function (p) {
        var pageBtn = document.createElement('button');
        pageBtn.textContent = String(p);
        if (p === currentPage) pageBtn.classList.add('active');
        pageBtn.addEventListener('click', function () { currentPage = p; renderArticles(); });
        pagination.appendChild(pageBtn);
      })(p);
    }

    var nextBtn = document.createElement('button');
    nextBtn.textContent = '›';
    nextBtn.disabled = currentPage === totalPages;
    nextBtn.addEventListener('click', function () { currentPage += 1; renderArticles(); });
    pagination.appendChild(nextBtn);
  }

  renderArticles();

  // ── 기사 가져오기 모달 (아주경제/영상/포토 + 관련기사 팝업과 동일한 검색 UI) ──
  var ajuTitles = [
    '서초구, 반포동 스마트 자전거 200대 추가 도입',
    '반포바이크 이용자 한 달 만에 3만명 돌파',
    '서초구청, 자전거도로 정비 예산 확대 편성',
    '스마트시티 시범지구 반포동 선정 배경은',
    '서초구 교통사고 감소, 자전거 인프라 효과 분석',
    '서울시, 자치구 스마트 모빌리티 사업 평가 착수',
    '서초구의회, 스마트시티 조례 개정안 통과',
    '전기자전거 배터리 화재 예방 대책 마련',
    '서울 자치구 중 서초구 스마트시티 지수 1위',
    '서초구, 내년도 스마트시티 예산 전년比 20% 증액',
    '자전거 공유서비스 사고 책임 소재 논란',
    '서초구청장, 스마트 모빌리티 해외 사례 시찰',
    '서울시내 공유자전거 이용률 지역별 비교',
    '서초구 스마트시티 사업, 국토부 우수사례 선정',
    '서초구, 반포동 이어 방배동에도 자전거 사업 확대',
    '국회, 예산안 심사 본격 착수',
    '수출 증가세 3개월 연속 이어져',
    '증시, 외국인 매수세에 강세'
  ];
  var videoTitles = [
    '반포바이크 현장 스케치 영상',
    '스마트시티 예산안 통과 순간 영상',
    '반포동 주민 인터뷰 모음 영상',
    '폭염 속 온열질환 예방법 영상',
    '프로야구 순위 경쟁 하이라이트 영상',
    '국회 예산안 심사 현장 영상',
    '반포한강공원 자전거길 개통 현장 영상',
    '서초구청장 인터뷰 영상',
    '전기자전거 배터리 안전 점검 영상',
    '반포바이크 앱 사용법 가이드 영상',
    '자전거도로 정비 공사 드론 촬영 영상',
    '서초구 스마트시티 해외 시찰 영상'
  ];
  var photoTitles = [
    '반포바이크 출범식 현장 포토',
    '반포한강공원 자전거길 포토',
    '서초구청 스마트시티 브리핑 포토',
    '반포동 상권 활성화 현장 포토',
    '자전거 안전교육 현장 포토',
    '서초구의회 조례 개정 현장 포토',
    '반포바이크 정류소 전경 포토',
    '스마트시티 조성 현장 포토',
    '반포동 재건축 현장 포토',
    '서초구 교통정책 설명회 포토'
  ];
  var importKeywordPool = ['반포바이크', '스마트시티', '자전거', '서초구', '교통', '환경', '지자체'];

  function fmtImportDate(daysAgo) {
    var d = new Date();
    d.setDate(d.getDate() - daysAgo);
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  var sourcePools = { aju: ajuTitles, video: videoTitles, photo: photoTitles };
  var sourceCandidates = {};
  Object.keys(sourcePools).forEach(function (key) {
    sourceCandidates[key] = sourcePools[key].map(function (title, i) {
      return {
        title: title,
        date: fmtImportDate(i * 3),
        keywords: [importKeywordPool[i % importKeywordPool.length], importKeywordPool[(i + 2) % importKeywordPool.length]]
      };
    });
  });

  var currentImportSource = 'aju';
  var importFiltered = sourceCandidates.aju.slice();
  var IMPORT_PAGE_SIZE = 10;
  var importCurrentPage = 1;
  var importSelected = []; // 선택된 제목 배열 (개수 제한 없음)

  var importModalOverlay = document.getElementById('importModalOverlay');
  var importResultsList = document.getElementById('importResultsList');
  var importPagination = document.getElementById('importPagination');
  var importSelectedCount = document.getElementById('importSelectedCount');

  function openImportModal() {
    document.querySelectorAll('#importSourceTabs .source-tab').forEach(function (t) { t.classList.remove('active'); });
    document.querySelector('#importSourceTabs .source-tab[data-source="aju"]').classList.add('active');
    currentImportSource = 'aju';
    document.getElementById('importStartDate').value = '';
    document.getElementById('importEndDate').value = '';
    document.getElementById('importSearchType').value = 'all';
    document.getElementById('importSearchInput').value = '';
    importSelected = [];
    importFiltered = sourceCandidates[currentImportSource].slice();
    importCurrentPage = 1;
    renderImportResults();
    importModalOverlay.classList.add('show');
  }

  document.getElementById('btnCloseImportModal').addEventListener('click', function () {
    importModalOverlay.classList.remove('show');
  });
  importModalOverlay.addEventListener('click', function (e) {
    if (e.target === importModalOverlay) importModalOverlay.classList.remove('show');
  });

  document.querySelectorAll('#importSourceTabs .source-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('#importSourceTabs .source-tab').forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      currentImportSource = tab.getAttribute('data-source');
      importFiltered = sourceCandidates[currentImportSource].slice();
      importCurrentPage = 1;
      renderImportResults();
    });
  });

  document.getElementById('btnImportSearch').addEventListener('click', function () {
    var startVal = document.getElementById('importStartDate').value;
    var endVal = document.getElementById('importEndDate').value;
    var searchType = document.getElementById('importSearchType').value;
    var query = document.getElementById('importSearchInput').value.trim();
    var pool = sourceCandidates[currentImportSource];

    importFiltered = pool.filter(function (c) {
      if (startVal && c.date < startVal) return false;
      if (endVal && c.date > endVal) return false;
      if (query === '') return true;
      if (searchType === 'title') return c.title.indexOf(query) !== -1;
      if (searchType === 'keyword') return c.keywords.some(function (k) { return k.indexOf(query) !== -1; });
      return c.title.indexOf(query) !== -1 || c.keywords.some(function (k) { return k.indexOf(query) !== -1; });
    });

    importCurrentPage = 1;
    renderImportResults();

    if (importFiltered.length === 0) {
      showToast('검색 결과가 없습니다');
    }
  });

  function renderImportResults() {
    var totalPages = Math.ceil(importFiltered.length / IMPORT_PAGE_SIZE);
    var startIdx = (importCurrentPage - 1) * IMPORT_PAGE_SIZE;
    var pageItems = importFiltered.slice(startIdx, startIdx + IMPORT_PAGE_SIZE);

    importResultsList.innerHTML = '';
    if (pageItems.length === 0) {
      importResultsList.innerHTML = '<div class="import-empty">조건에 맞는 기사가 없습니다</div>';
    }
    pageItems.forEach(function (c) {
      var item = document.createElement('div');
      item.className = 'import-result-item';
      if (importSelected.indexOf(c.title) !== -1) item.classList.add('selected');
      item.innerHTML = '<span class="r-title">' + c.title + '</span><span class="r-meta">' + c.date + ' · ' + c.keywords.join(', ') + '</span>';
      item.addEventListener('click', function () {
        var pos = importSelected.indexOf(c.title);
        if (pos !== -1) {
          importSelected.splice(pos, 1);
        } else {
          importSelected.push(c.title);
        }
        renderImportResults();
      });
      importResultsList.appendChild(item);
    });

    importSelectedCount.textContent = importSelected.length + '개 선택됨';
    renderImportPagination(totalPages);
  }

  function renderImportPagination(totalPages) {
    importPagination.innerHTML = '';
    if (totalPages <= 1) return;

    var prevBtn = document.createElement('button');
    prevBtn.textContent = '‹';
    prevBtn.disabled = importCurrentPage === 1;
    prevBtn.addEventListener('click', function () { importCurrentPage -= 1; renderImportResults(); });
    importPagination.appendChild(prevBtn);

    for (var p = 1; p <= totalPages; p++) {
      (function (p) {
        var pageBtn = document.createElement('button');
        pageBtn.textContent = String(p);
        if (p === importCurrentPage) pageBtn.classList.add('active');
        pageBtn.addEventListener('click', function () { importCurrentPage = p; renderImportResults(); });
        importPagination.appendChild(pageBtn);
      })(p);
    }

    var nextBtn = document.createElement('button');
    nextBtn.textContent = '›';
    nextBtn.disabled = importCurrentPage === totalPages;
    nextBtn.addEventListener('click', function () { importCurrentPage += 1; renderImportResults(); });
    importPagination.appendChild(nextBtn);
  }

  document.getElementById('btnImportAdd').addEventListener('click', function () {
    if (importSelected.length === 0) {
      showToast('가져올 기사를 선택해주세요');
      return;
    }
    var now = new Date();
    var nowStr = fmt(0, now.getHours(), now.getMinutes());
    importSelected.forEach(function (title) {
      articles.unshift({ title: title, createdAt: nowStr, updatedAt: nowStr });
    });
    importModalOverlay.classList.remove('show');
    currentPage = 1;
    renderArticles();
    showToast(importSelected.length + '개의 기사를 가져왔습니다');
  });


  document.querySelectorAll('.nav-parent-row').forEach(function (row) {
    row.addEventListener('click', function () {
      var navItem = row.closest('.nav-item');
      var submenu = navItem.querySelector('.submenu');
      var toggleBtn = navItem.querySelector('.nav-toggle');
      submenu.classList.toggle('open');
      toggleBtn.classList.toggle('open');
    });
  });
</script>

</body>
</html>
