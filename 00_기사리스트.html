<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아주경제 부산 관리페이지 - 기사 리스트</title>
<style>
  :root {
    --border: #e2e0d8;
    --border-strong: #c8c5ba;
    --text-primary: #1c1c1a;
    --text-secondary: #5f5e5a;
    --text-muted: #96948a;
    --surface-1: #f6f5f0;
    --surface-2: #ffffff;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --success-bg: #eaf3de;
    --success-text: #3b6d11;
    --amber-bg: #faeeda;
    --amber-text: #854f0b;
    --danger-bg: #fcebeb;
    --danger-text: #a32d2d;
    --radius: 8px;

    --shell-bg: #333b49;
    --shell-bg-active: #262c38;
    --shell-text-muted: #9298a5;
    --shell-border: #454d5c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--surface-2);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--shell-bg);
    color: #fff;
    padding: 0 24px;
    height: 56px;
    flex-shrink: 0;
  }
  .app-header .brand { display: flex; align-items: center; gap: 12px; }
  .app-header .brand .logo { font-size: 19px; font-weight: 800; letter-spacing: 0.5px; }
  .app-header .brand .divider { color: var(--shell-text-muted); font-size: 14px; }
  .app-header .brand .label { font-size: 14px; color: #fff; }
  .app-header .account { display: flex; align-items: center; gap: 10px; }
  .app-header .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #7b8291;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px;
  }
  .app-header .account-name { font-size: 13px; font-weight: 600; }
  .app-header .btn-logout {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.5);
    color: #fff;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 4px;
  }
  .app-header .btn-logout:hover { background: rgba(255,255,255,0.1); }

  .app-body {
    display: flex;
    flex: 1;
  }

  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--shell-bg);
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    padding: 22px 20px;
    text-align: center;
    border-bottom: 0.5px solid var(--shell-border);
  }
  .sidebar-header .site-name { color: #fff; font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .sidebar-header .sub-label {
    color: var(--shell-text-muted);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .sidebar-nav { display: flex; flex-direction: column; }
  .sidebar-nav a {
    display: block;
    padding: 16px 20px;
    text-align: center;
    font-size: 13px;
    color: var(--shell-text-muted);
    text-decoration: none;
    border-bottom: 0.5px solid var(--shell-border);
  }
  .sidebar-nav a:hover { color: #fff; }
  .sidebar-nav a.active {
    background: var(--shell-bg-active);
    color: #fff;
    font-weight: 700;
  }

  .nav-parent-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 16px 20px;
    font-size: 13px;
    color: var(--shell-text-muted);
    border-bottom: 0.5px solid var(--shell-border);
    cursor: pointer;
  }
  .nav-parent-row:hover { color: #fff; }
  .nav-parent-row .nav-parent-link {
    color: inherit;
    font: inherit;
  }
  .nav-toggle {
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 1em;
    line-height: 1;
    padding: 0;
    transition: transform 0.2s;
  }
  .nav-toggle.open { transform: rotate(180deg); }
  .submenu {
    display: none;
    flex-direction: column;
    background: rgba(0,0,0,0.15);
  }
  .submenu.open { display: flex; }
  .submenu a {
    padding: 12px 20px;
    text-align: left;
    font-size: 12px;
    color: var(--shell-text-muted);
    text-decoration: none;
    border-bottom: none;
  }
  .submenu a:hover { color: #fff; }
  .submenu a.active {
    color: #fff;
    font-weight: 700;
    background: var(--shell-bg-active);
  }


  .main-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .main-content {
    flex: 1;
    padding: 24px 24px 24px 50px;
  }
  .content-inner { max-width: 1200px; margin: 0; }

  .app-footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    padding: 16px 0;
    border-top: 0.5px solid var(--border);
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .topbar h1 { font-size: 22px; font-weight: 700; margin: 0; }

  .filter-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
    padding: 10px 12px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-1);
  }
  .filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-bar select, .filter-bar input {
    font-family: inherit;
    font-size: 12px;
    padding: 7px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    background: var(--surface-2);
  }
  .custom-date-range { display: none; align-items: center; gap: 6px; }
  .custom-date-range.show { display: flex; }
  .custom-date-range .tilde { color: var(--text-muted); font-size: 12px; }
  .custom-date-range button { font-size: 11px; padding: 6px 10px; }

  button {
    font-family: inherit;
    font-size: 13px;
    border-radius: var(--radius);
    padding: 9px 16px;
    cursor: pointer;
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-secondary);
  }
  button:hover { background: var(--surface-1); }
  button.primary {
    background: var(--text-primary);
    color: #fff;
    border: none;
  }
  button.primary:hover { background: #333; }
  button:disabled { opacity: 0.3; cursor: not-allowed; }
  button:disabled:hover { background: var(--surface-2); }

  .table-wrap {
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  thead tr { background: var(--surface-1); text-align: left; }
  th {
    padding: 10px 10px;
    font-weight: 500;
    color: var(--text-secondary);
    font-size: 12px;
  }
  td {
    padding: 10px 10px;
    border-top: 0.5px solid var(--border);
    vertical-align: middle;
  }
  th.col-no, td.col-no { width: 48px; text-align: center; color: var(--text-muted); }
  th.col-title, td.col-title { }
  th.col-cat, td.col-cat { width: 130px; color: var(--text-secondary); }
  th.col-date, td.col-date { width: 130px; color: var(--text-muted); font-size: 12px; }
  th.col-status, td.col-status { width: 90px; }
  th.col-order, td.col-order { width: 80px; text-align: center; }

  .title-cell {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
    max-width: 100%;
    cursor: pointer;
  }
  .title-cell:hover { color: var(--accent); }

  .badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; white-space: nowrap; }
  .badge.published { background: var(--success-bg); color: var(--success-text); }
  .badge.scheduled { background: var(--accent-bg); color: var(--accent); }
  .badge.draft { background: var(--surface-1); color: var(--text-muted); border: 0.5px solid var(--border); }
  .badge.private { background: var(--danger-bg); color: var(--danger-text); }

  .order-btns { display: flex; justify-content: center; gap: 2px; }
  .order-btns button {
    width: 24px; height: 24px;
    padding: 0;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }

  .empty-row td {
    text-align: center;
    color: var(--text-muted);
    padding: 24px 0;
  }

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
  }
  .pagination button {
    width: 28px;
    height: 28px;
    padding: 0;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .pagination button.active {
    background: var(--text-primary);
    color: #fff;
    border: none;
  }
  .pagination button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="logo">AGN</span>
    <span class="divider">|</span>
    <span class="label">관리페이지</span>
  </div>
  <div class="account">
    <span class="avatar">👤</span>
    <span class="account-name">신동규 기자</span>
    <button class="btn-logout">로그아웃</button>
  </div>
</header>

<div class="app-body">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="site-name">아주경제 부산</div>
      <div class="sub-label">⚙ 관리페이지</div>
    </div>
    <nav class="sidebar-nav">
      <a href="#">기본관리</a>
      <div class="nav-item">
        <div class="nav-parent-row">
          <span class="nav-parent-link">뉴스관리</span>
          <button class="nav-toggle open" aria-label="하위메뉴 열기">▾</button>
        </div>
        <div class="submenu open">
          <a href="00_기사리스트.html" class="active">일반뉴스</a>
          <a href="#">프리미엄뉴스</a>
          <a href="#">동영상뉴스</a>
          <a href="#">포토뉴스</a>
        </div>
      </div>
      <a href="02_쇼츠등록.html">쇼츠관리</a>
      <a href="03_캘린더관리.html">캘린더관리</a>
      <a href="#">기자관리</a>
      <a href="#">광고관리</a>
      <a href="#">디자인관리</a>
    </nav>
  </aside>

  <div class="main-column">
    <main class="main-content">
      <div class="content-inner">

  <div class="topbar">
    <h1>기사 리스트</h1>
    <button class="primary" id="btnGoRegister">+ 기사 등록</button>
  </div>

  <div class="filter-bar">
    <div class="filter-group">
      <select id="periodSelect">
        <option value="all">전체 기간</option>
        <option value="today">오늘</option>
        <option value="week">일주일</option>
        <option value="month">1개월</option>
        <option value="custom">직접선택</option>
      </select>
      <span class="custom-date-range" id="customDateRange">
        <input type="date" id="startDate">
        <span class="tilde">~</span>
        <input type="date" id="endDate">
        <button id="btnApplyCustomDate">적용</button>
      </span>
    </div>
    <select id="statusFilterSelect">
      <option value="all">전체 상태</option>
      <option value="published">발행중</option>
      <option value="scheduled">예약발행</option>
      <option value="draft">임시저장</option>
      <option value="private">비공개</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-no">NO</th>
          <th class="col-title">제목</th>
          <th class="col-cat">카테고리</th>
          <th class="col-date">등록일시</th>
          <th class="col-date">수정일시</th>
          <th class="col-status">상태</th>
          <th class="col-order">순서변경</th>
        </tr>
      </thead>
      <tbody id="articleTableBody"></tbody>
    </table>
  </div>

  <div class="pagination" id="articlePagination"></div>

      </div>
    </main>

    <footer class="app-footer">Copyright ⓒ 아주경제 All rights reserved.</footer>
  </div>

</div>

<div class="toast" id="toast" style="position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--text-primary); color:#fff; padding:10px 18px; border-radius:var(--radius); font-size:13px; opacity:0; transition:opacity 0.2s, transform 0.2s; pointer-events:none; z-index:10;"></div>

<script>
  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(-50%) translateY(0)';
    setTimeout(function () {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(-50%) translateY(20px)';
    }, 1800);
  }

  document.getElementById('btnGoRegister').addEventListener('click', function () {
    window.location.href = '01_기사등록.html';
  });

  var statusLabel = { published: '발행중', scheduled: '예약발행', draft: '임시저장', private: '비공개' };

  function fmt(daysAgo, hour, min) {
    var d = new Date();
    d.setDate(d.getDate() - daysAgo);
    d.setHours(hour, min, 0, 0);
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + pad(hour) + ':' + pad(min);
  }

  var titlePool = [
    '서초구, 반포동에 AI 자전거 시범운영',
    '스마트 자전거 확대 검토, 다음 달 발표',
    '서초구 교통 정책 인터뷰 초안',
    '반포동 주민 반응은 엇갈려',
    '스마트시티 예산안 시의회 통과',
    '자전거 대여소 위치 선정 논란',
    '서초구청장 인터뷰 전문',
    '과거 오보 정정 관련 기사',
    '반포바이크 이용자 한 달 만에 3만명 돌파',
    '서초구청, 자전거도로 정비 예산 확대 편성',
    '스마트시티 시범지구 반포동 선정 배경은',
    '반포동 주민센터, 자전거 안전교육 프로그램 운영',
    '서초구 교통사고 감소, 자전거 인프라 효과 분석',
    '서울시, 자치구 스마트 모빌리티 사업 평가 착수',
    '반포한강공원 자전거길 연결 공사 내달 시작',
    '서초구의회, 스마트시티 조례 개정안 통과',
    '전기자전거 배터리 화재 예방 대책 마련',
    '반포동 상권, 자전거 이용객 증가로 매출 상승',
    '서울 자치구 중 서초구 스마트시티 지수 1위',
    '반포바이크 앱 이용후기, 만족도 조사 결과 공개',
    '서초구, 내년도 스마트시티 예산 전년比 20% 증액',
    '자전거 공유서비스 사고 책임 소재 논란',
    '반포동 재건축 단지, 자전거 주차공간 의무화',
    '서초구청장, 스마트 모빌리티 해외 사례 시찰',
    '반포바이크 정류소 위치 선정 기준 공개',
    '서울시내 공유자전거 이용률 지역별 비교',
    '반포동 학부모, 통학로 자전거도로 안전 요구',
    '서초구 스마트시티 사업, 국토부 우수사례 선정',
    '자전거 공유서비스 확대에 주민 의견 엇갈려',
    '반포동 소상공인, 스마트시티 인프라 활용법 문의 늘어',
    '서초구, 반포동 이어 방배동에도 자전거 사업 확대',
    '국회, 예산안 심사 본격 착수',
    '여야, 민생법안 처리 두고 신경전',
    '수출 증가세 3개월 연속 이어져',
    '증시, 외국인 매수세에 강세',
    '폭염 계속, 온열질환 주의보 확대',
    '프로야구, 순위 경쟁 막판까지 치열'
  ];

  var catPool = [
    { cat1: '지역뉴스', cat2: '지자체의회' },
    { cat1: '지역뉴스', cat2: '지역경제' },
    { cat1: '지역뉴스', cat2: '인물' },
    { cat1: '라이프', cat2: '우리동네 이야기' },
    { cat1: '아주뉴스', cat2: '' },
    { cat1: '포토/영상', cat2: '포토뉴스' }
  ];
  var statusPool = ['published', 'scheduled', 'draft', 'private'];

  var TOTAL_SAMPLE = 45;
  var articles = [];
  for (var gi = 0; gi < TOTAL_SAMPLE; gi++) {
    var cat = catPool[gi % catPool.length];
    var baseTitle = titlePool[gi % titlePool.length];
    var repeatSuffix = gi >= titlePool.length ? ' (' + (Math.floor(gi / titlePool.length) + 1) + ')' : '';
    var createdDaysAgo = gi; // 0~44일 전으로 분산 (기간 필터 시연용)
    var updatedDaysAgo = Math.max(0, createdDaysAgo - (gi % 3));
    articles.push({
      title: baseTitle + repeatSuffix,
      cat1: cat.cat1,
      cat2: cat.cat2,
      createdAt: fmt(createdDaysAgo, 9 + (gi % 10), (gi * 7) % 60),
      updatedAt: fmt(updatedDaysAgo, 10 + (gi % 8), (gi * 11) % 60),
      status: statusPool[gi % statusPool.length]
    });
  }

  var tbody = document.getElementById('articleTableBody');

  function parseDate(str) {
    var parts = str.split(' ');
    var dateParts = parts[0].split('.').map(Number);
    var timeParts = (parts[1] || '00:00').split(':').map(Number);
    return new Date(dateParts[0], dateParts[1] - 1, dateParts[2], timeParts[0], timeParts[1]);
  }

  var periodSelect = document.getElementById('periodSelect');
  var statusFilterSelect = document.getElementById('statusFilterSelect');
  var customDateRange = document.getElementById('customDateRange');
  var startDateInput = document.getElementById('startDate');
  var endDateInput = document.getElementById('endDate');

  var PAGE_SIZE = 20;
  var currentPage = 1;

  periodSelect.addEventListener('change', function () {
    if (periodSelect.value === 'custom') {
      customDateRange.classList.add('show');
    } else {
      customDateRange.classList.remove('show');
      currentPage = 1;
      renderArticles();
    }
  });
  statusFilterSelect.addEventListener('change', function () {
    currentPage = 1;
    renderArticles();
  });
  document.getElementById('btnApplyCustomDate').addEventListener('click', function () {
    if (!startDateInput.value || !endDateInput.value) {
      showToast('시작일과 종료일을 모두 선택해주세요');
      return;
    }
    currentPage = 1;
    renderArticles();
  });

  function getFilteredArticles() {
    var period = periodSelect.value;
    var status = statusFilterSelect.value;
    var now = new Date();

    return articles.filter(function (a) {
      if (status !== 'all' && a.status !== status) return false;

      if (period === 'all') return true;

      var created = parseDate(a.createdAt);

      if (period === 'today') {
        return created.getFullYear() === now.getFullYear() &&
               created.getMonth() === now.getMonth() &&
               created.getDate() === now.getDate();
      }
      if (period === 'week') {
        var weekAgo = new Date(now); weekAgo.setDate(now.getDate() - 7);
        return created >= weekAgo && created <= now;
      }
      if (period === 'month') {
        var monthAgo = new Date(now); monthAgo.setMonth(now.getMonth() - 1);
        return created >= monthAgo && created <= now;
      }
      if (period === 'custom') {
        if (!startDateInput.value || !endDateInput.value) return true;
        var start = new Date(startDateInput.value + 'T00:00:00');
        var end = new Date(endDateInput.value + 'T23:59:59');
        return created >= start && created <= end;
      }
      return true;
    });
  }

  function isFiltering() {
    return periodSelect.value !== 'all' || statusFilterSelect.value !== 'all';
  }

  function renderArticles() {
    tbody.innerHTML = '';
    var filtered = getFilteredArticles();
    var reorderDisabled = isFiltering();

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="7">조건에 맞는 기사가 없습니다</td></tr>';
      document.getElementById('articlePagination').innerHTML = '';
      return;
    }

    var totalPages = Math.ceil(filtered.length / PAGE_SIZE);
    if (currentPage > totalPages) currentPage = totalPages;
    var startIdx = (currentPage - 1) * PAGE_SIZE;
    var pageItems = filtered.slice(startIdx, startIdx + PAGE_SIZE);

    pageItems.forEach(function (a, i) {
      var idx = startIdx + i;
      var realIdx = articles.indexOf(a);
      var tr = document.createElement('tr');
      var catText = a.cat2 ? a.cat1 + '<br>' + a.cat2 : a.cat1;
      tr.innerHTML =
        '<td class="col-no">' + (idx + 1) + '</td>' +
        '<td class="col-title"><span class="title-cell" data-idx="' + realIdx + '">' + a.title + '</span></td>' +
        '<td class="col-cat">' + catText + '</td>' +
        '<td class="col-date">' + a.createdAt + '</td>' +
        '<td class="col-date">' + a.updatedAt + '</td>' +
        '<td class="col-status"><span class="badge ' + a.status + '">' + statusLabel[a.status] + '</span></td>' +
        '<td class="col-order">' +
          '<div class="order-btns">' +
            '<button class="btn-up" data-idx="' + realIdx + '" ' + (reorderDisabled || realIdx === 0 ? 'disabled' : '') + '>▲</button>' +
            '<button class="btn-down" data-idx="' + realIdx + '" ' + (reorderDisabled || realIdx === articles.length - 1 ? 'disabled' : '') + '>▼</button>' +
          '</div>' +
        '</td>';
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll('.title-cell').forEach(function (el) {
      el.addEventListener('click', function () {
        window.location.href = '06_기사수정.html';
      });
    });

    tbody.querySelectorAll('.btn-up').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-idx'));
        if (idx === 0) return;
        var tmp = articles[idx - 1];
        articles[idx - 1] = articles[idx];
        articles[idx] = tmp;
        renderArticles();
      });
    });

    tbody.querySelectorAll('.btn-down').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-idx'));
        if (idx === articles.length - 1) return;
        var tmp = articles[idx + 1];
        articles[idx + 1] = articles[idx];
        articles[idx] = tmp;
        renderArticles();
      });
    });

    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    var pagination = document.getElementById('articlePagination');
    pagination.innerHTML = '';
    if (totalPages <= 1) return;

    var prevBtn = document.createElement('button');
    prevBtn.textContent = '‹';
    prevBtn.disabled = currentPage === 1;
    prevBtn.addEventListener('click', function () { currentPage -= 1; renderArticles(); });
    pagination.appendChild(prevBtn);

    for (var p = 1; p <= totalPages; p++) {
      (function (p) {
        var pageBtn = document.createElement('button');
        pageBtn.textContent = String(p);
        if (p === currentPage) pageBtn.classList.add('active');
        pageBtn.addEventListener('click', function () { currentPage = p; renderArticles(); });
        pagination.appendChild(pageBtn);
      })(p);
    }

    var nextBtn = document.createElement('button');
    nextBtn.textContent = '›';
    nextBtn.disabled = currentPage === totalPages;
    nextBtn.addEventListener('click', function () { currentPage += 1; renderArticles(); });
    pagination.appendChild(nextBtn);
  }

  renderArticles();


  document.querySelectorAll('.nav-parent-row').forEach(function (row) {
    row.addEventListener('click', function () {
      var navItem = row.closest('.nav-item');
      var submenu = navItem.querySelector('.submenu');
      var toggleBtn = navItem.querySelector('.nav-toggle');
      submenu.classList.toggle('open');
      toggleBtn.classList.toggle('open');
    });
  });
</script>

</body>
</html>
