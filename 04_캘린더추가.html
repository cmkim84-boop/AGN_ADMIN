<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아주경제 부산 관리페이지 - 캘린더 추가</title>
<style>
  :root {
    --border: #e2e0d8;
    --border-strong: #c8c5ba;
    --text-primary: #1c1c1a;
    --text-secondary: #5f5e5a;
    --text-muted: #96948a;
    --surface-1: #f6f5f0;
    --surface-2: #ffffff;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --success-bg: #eaf3de;
    --success-text: #3b6d11;
    --amber-bg: #faeeda;
    --amber-text: #854f0b;
    --danger-bg: #fcebeb;
    --danger-text: #a32d2d;
    --radius: 8px;

    --shell-bg: #333b49;
    --shell-bg-active: #262c38;
    --shell-text-muted: #9298a5;
    --shell-border: #454d5c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--surface-2);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--shell-bg);
    color: #fff;
    padding: 0 24px;
    height: 56px;
    flex-shrink: 0;
  }
  .app-header .brand { display: flex; align-items: center; gap: 12px; }
  .app-header .brand .logo { font-size: 19px; font-weight: 800; letter-spacing: 0.5px; }
  .app-header .brand .divider { color: var(--shell-text-muted); font-size: 14px; }
  .app-header .brand .label { font-size: 14px; color: #fff; }
  .app-header .account { display: flex; align-items: center; gap: 10px; }
  .app-header .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #7b8291;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px;
  }
  .app-header .account-name { font-size: 13px; font-weight: 600; }
  .app-header .btn-logout {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.5);
    color: #fff;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 4px;
  }
  .app-header .btn-logout:hover { background: rgba(255,255,255,0.1); }

  .app-body { display: flex; flex: 1; }

  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--shell-bg);
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    padding: 22px 20px;
    text-align: center;
    border-bottom: 0.5px solid var(--shell-border);
  }
  .sidebar-header .site-name { color: #fff; font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .sidebar-header .sub-label {
    color: var(--shell-text-muted);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .sidebar-nav { display: flex; flex-direction: column; }
  .sidebar-nav a {
    display: block;
    padding: 16px 20px;
    text-align: center;
    font-size: 13px;
    color: var(--shell-text-muted);
    text-decoration: none;
    border-bottom: 0.5px solid var(--shell-border);
  }
  .sidebar-nav a:hover { color: #fff; }
  .sidebar-nav a.active {
    background: var(--shell-bg-active);
    color: #fff;
    font-weight: 700;
  }

  .nav-parent-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 16px 20px;
    font-size: 13px;
    color: var(--shell-text-muted);
    border-bottom: 0.5px solid var(--shell-border);
    cursor: pointer;
  }
  .nav-parent-row:hover { color: #fff; }
  .nav-parent-row .nav-parent-link {
    color: inherit;
    font: inherit;
  }
  .nav-toggle {
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 1em;
    line-height: 1;
    padding: 0;
    transition: transform 0.2s;
  }
  .nav-toggle.open { transform: rotate(180deg); }
  .submenu {
    display: none;
    flex-direction: column;
    background: rgba(0,0,0,0.15);
  }
  .submenu.open { display: flex; }
  .submenu a {
    padding: 12px 20px;
    text-align: left;
    font-size: 12px;
    color: var(--shell-text-muted);
    text-decoration: none;
    border-bottom: none;
  }
  .submenu a:hover { color: #fff; }
  .submenu a.active {
    color: #fff;
    font-weight: 700;
    background: var(--shell-bg-active);
  }


  .main-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .main-content {
    flex: 1;
    padding: 24px 24px 24px 50px;
  }
  .content-inner { max-width: 640px; margin: 0; }

  .app-footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    padding: 16px 0;
    border-top: 0.5px solid var(--border);
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .topbar h1 { font-size: 22px; font-weight: 700; margin: 0; }
  .topbar-actions { display: flex; gap: 8px; }

  button {
    font-family: inherit;
    font-size: 13px;
    border-radius: var(--radius);
    padding: 9px 16px;
    cursor: pointer;
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-secondary);
  }
  button:hover { background: var(--surface-1); }
  button.primary { background: var(--text-primary); color: #fff; border: none; }
  button.primary:hover { background: #333; }

  .card {
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 10px;
  }

  textarea, input[type="text"], input[type="date"], input[type="time"] {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
  }
  textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-primary);
    margin-bottom: 12px;
    cursor: pointer;
  }
  .checkbox-row input { width: auto; }

  .date-range-row, .time-range-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .date-range-row input, .time-range-row input { flex: 1; min-width: 0; }
  .range-tilde { color: var(--text-muted); font-size: 13px; flex-shrink: 0; }

  .field-sub { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text-primary); color: #fff;
    padding: 10px 18px; border-radius: var(--radius); font-size: 13px;
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="logo">AGN</span>
    <span class="divider">|</span>
    <span class="label">관리페이지</span>
  </div>
  <div class="account">
    <span class="avatar">👤</span>
    <span class="account-name">신동규 기자</span>
    <button class="btn-logout">로그아웃</button>
  </div>
</header>

<div class="app-body">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="site-name">아주경제 부산</div>
      <div class="sub-label">⚙ 관리페이지</div>
    </div>
    <nav class="sidebar-nav">
      <a href="#">기본관리</a>
      <div class="nav-item">
        <div class="nav-parent-row">
          <span class="nav-parent-link">뉴스관리</span>
          <button class="nav-toggle" aria-label="하위메뉴 열기">▾</button>
        </div>
        <div class="submenu">
          <a href="00_기사리스트.html">일반뉴스</a>
          <a href="07_프리미엄뉴스.html">프리미엄뉴스</a>
          <a href="#">동영상뉴스</a>
          <a href="#">포토뉴스</a>
        </div>
      </div>
      <a href="02_쇼츠등록.html">쇼츠관리</a>
      <a href="03_캘린더관리.html" class="active">캘린더관리</a>
      <a href="#">기자관리</a>
      <a href="#">광고관리</a>
      <a href="#">디자인관리</a>
    </nav>
  </aside>

  <div class="main-column">
    <main class="main-content">
      <div class="content-inner">

        <div class="topbar">
          <h1>캘린더 추가</h1>
          <div class="topbar-actions">
            <button id="btnCancel">취소</button>
            <button class="primary" id="btnSubmit">등록</button>
          </div>
        </div>

        <div class="card">
          <div class="card-label">행사내용</div>
          <textarea id="contentInput" placeholder="행사 내용을 입력하세요"></textarea>
        </div>

        <div class="card">
          <div class="card-label">날짜</div>
          <label class="checkbox-row">
            <input type="checkbox" id="singleDayCheck" checked>
            하루짜리 행사
          </label>
          <div class="date-range-row">
            <input type="date" id="startDateInput">
            <span class="range-tilde" id="dateTilde" style="display:none;">~</span>
            <input type="date" id="endDateInput" style="display:none;">
          </div>
        </div>

        <div class="card">
          <div class="card-label">시간</div>
          <div class="time-range-row">
            <input type="time" id="startTimeInput">
            <span class="range-tilde">~</span>
            <input type="time" id="endTimeInput">
          </div>
          <div class="field-sub">종일 진행되는 행사는 비워두셔도 됩니다.</div>
        </div>

        <div class="card">
          <div class="card-label">관련 기사 링크</div>
          <input type="text" id="articleUrlInput" placeholder="https://... (해당 행사와 관련된 기사가 있으면 입력)">
          <div class="field-sub">선택 입력 항목입니다. 입력하면 목록에서 기사 아이콘으로 표시됩니다.</div>
        </div>

      </div>
    </main>
    <footer class="app-footer">Copyright ⓒ 아주경제 All rights reserved.</footer>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  var singleDayCheck = document.getElementById('singleDayCheck');
  var endDateInput = document.getElementById('endDateInput');
  var dateTilde = document.getElementById('dateTilde');
  var startDateInput = document.getElementById('startDateInput');

  function updateDateMode() {
    var isSingle = singleDayCheck.checked;
    endDateInput.style.display = isSingle ? 'none' : 'block';
    dateTilde.style.display = isSingle ? 'none' : 'inline';
  }
  singleDayCheck.addEventListener('change', updateDateMode);
  updateDateMode();

  document.getElementById('btnCancel').addEventListener('click', function () {
    showToast('작성 중인 내용이 취소되었습니다');
  });

  document.getElementById('btnSubmit').addEventListener('click', function () {
    var content = document.getElementById('contentInput').value.trim();
    var startDate = startDateInput.value;
    var endDate = singleDayCheck.checked ? startDate : endDateInput.value;

    if (content === '') {
      showToast('행사내용을 입력해주세요');
      return;
    }
    if (!startDate) {
      showToast('시작일을 선택해주세요');
      return;
    }
    if (!singleDayCheck.checked && !endDate) {
      showToast('종료일을 선택해주세요');
      return;
    }
    if (!singleDayCheck.checked && new Date(endDate) < new Date(startDate)) {
      showToast('종료일은 시작일보다 빠를 수 없습니다');
      return;
    }

    var articleUrl = document.getElementById('articleUrlInput').value.trim();
    if (articleUrl !== '' && articleUrl.indexOf('http') !== 0) {
      showToast('기사 링크는 http:// 또는 https://로 시작해야 합니다');
      return;
    }

    var dateLabel = startDate === endDate ? startDate : (startDate + ' ~ ' + endDate);
    showToast('"' + content + '" 일정이 등록되었습니다 (' + dateLabel + ')');
  });

  document.querySelectorAll('.nav-parent-row').forEach(function (row) {
    row.addEventListener('click', function () {
      var navItem = row.closest('.nav-item');
      var submenu = navItem.querySelector('.submenu');
      var toggleBtn = navItem.querySelector('.nav-toggle');
      submenu.classList.toggle('open');
      toggleBtn.classList.toggle('open');
    });
  });
</script>

</body>
</html>
