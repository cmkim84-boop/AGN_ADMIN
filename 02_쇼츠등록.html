<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아주경제 부산 관리페이지 - 쇼츠 등록</title>
<style>
  :root {
    --border: #e2e0d8;
    --border-strong: #c8c5ba;
    --text-primary: #1c1c1a;
    --text-secondary: #5f5e5a;
    --text-muted: #96948a;
    --surface-1: #f6f5f0;
    --surface-2: #ffffff;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --success-bg: #eaf3de;
    --success-text: #3b6d11;
    --amber-bg: #faeeda;
    --amber-text: #854f0b;
    --danger-bg: #fcebeb;
    --danger-text: #a32d2d;
    --radius: 8px;

    --shell-bg: #333b49;
    --shell-bg-active: #262c38;
    --shell-text-muted: #9298a5;
    --shell-border: #454d5c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--surface-2);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .page {
    max-width: 1200px;
    margin: 0;
  }
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--shell-bg);
    color: #fff;
    padding: 0 24px;
    height: 56px;
    flex-shrink: 0;
  }
  .app-header .brand { display: flex; align-items: center; gap: 12px; }
  .app-header .brand .logo { font-size: 19px; font-weight: 800; letter-spacing: 0.5px; }
  .app-header .brand .divider { color: var(--shell-text-muted); font-size: 14px; }
  .app-header .brand .label { font-size: 14px; color: #fff; }
  .app-header .account { display: flex; align-items: center; gap: 10px; }
  .app-header .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #7b8291;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px;
  }
  .app-header .account-name { font-size: 13px; font-weight: 600; }
  .app-header .btn-logout {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.5);
    color: #fff;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 4px;
  }
  .app-header .btn-logout:hover { background: rgba(255,255,255,0.1); }

  .app-body { display: flex; flex: 1; }

  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--shell-bg);
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    padding: 22px 20px;
    text-align: center;
    border-bottom: 0.5px solid var(--shell-border);
  }
  .sidebar-header .site-name { color: #fff; font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .sidebar-header .sub-label {
    color: var(--shell-text-muted);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .sidebar-nav { display: flex; flex-direction: column; }
  .sidebar-nav a {
    display: block;
    padding: 16px 20px;
    text-align: center;
    font-size: 13px;
    color: var(--shell-text-muted);
    text-decoration: none;
    border-bottom: 0.5px solid var(--shell-border);
  }
  .sidebar-nav a:hover { color: #fff; }
  .sidebar-nav a.active {
    background: var(--shell-bg-active);
    color: #fff;
    font-weight: 700;
  }

  .nav-parent-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 16px 20px;
    font-size: 13px;
    color: var(--shell-text-muted);
    border-bottom: 0.5px solid var(--shell-border);
    cursor: pointer;
  }
  .nav-parent-row:hover { color: #fff; }
  .nav-parent-row .nav-parent-link {
    color: inherit;
    font: inherit;
  }
  .nav-toggle {
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    font-size: 1em;
    line-height: 1;
    padding: 0;
    transition: transform 0.2s;
  }
  .nav-toggle.open { transform: rotate(180deg); }
  .submenu {
    display: none;
    flex-direction: column;
    background: rgba(0,0,0,0.15);
  }
  .submenu.open { display: flex; }
  .submenu a {
    padding: 12px 20px;
    text-align: left;
    font-size: 12px;
    color: var(--shell-text-muted);
    text-decoration: none;
    border-bottom: none;
  }
  .submenu a:hover { color: #fff; }
  .submenu a.active {
    color: #fff;
    font-weight: 700;
    background: var(--shell-bg-active);
  }


  .main-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .main-content {
    flex: 1;
    padding: 24px 24px 24px 50px;
  }
  .app-footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    padding: 16px 0;
    border-top: 0.5px solid var(--border);
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .topbar-title { display: flex; align-items: center; gap: 8px; }
  .topbar h1 { font-size: 22px; font-weight: 700; margin: 0; }
  .count-badge {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    color: var(--text-secondary);
  }
  .count-badge.ok { background: var(--success-bg); color: var(--success-text); border-color: transparent; }
  .count-badge.warn { background: var(--amber-bg); color: var(--amber-text); border-color: transparent; }

  button {
    font-family: inherit;
    font-size: 12px;
    border-radius: var(--radius);
    padding: 8px 14px;
    cursor: pointer;
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-secondary);
  }
  button:hover { background: var(--surface-1); }
  button.primary {
    background: var(--text-primary);
    color: #fff;
    border: none;
  }
  button.primary:hover { background: #333; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:disabled:hover { background: var(--surface-2); }

  .warning-banner {
    display: none;
    background: var(--amber-bg);
    color: var(--amber-text);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: var(--radius);
    margin-bottom: 16px;
  }
  .warning-banner.show { display: block; }

  .shorts-list {
    border: 0.5px solid var(--border);
    border-radius: 12px;
    background: var(--surface-2);
    overflow: hidden;
    margin-top: 16px;
  }
  .shorts-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-top: 0.5px solid var(--border);
  }
  .shorts-row:first-child { border-top: none; }
  .shorts-row .row-order {
    width: 22px;
    flex-shrink: 0;
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
  }
  .shorts-row .row-title {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .shorts-row .row-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .source-badge { font-size: 10px; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
  .source-badge.aju { background: var(--accent-bg); color: var(--accent); }
  .source-badge.keyword { background: var(--success-bg); color: var(--success-text); }
  .source-badge.direct { background: var(--amber-bg); color: var(--amber-text); }

  .btn-preview {
    font-size: 11px;
    padding: 5px 10px;
    white-space: nowrap;
  }

  .preview-thumb {
    width: 100%;
    aspect-ratio: 9/16;
    border-radius: var(--radius);
    background: var(--surface-1);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 22px;
  }
  .preview-thumb .play-icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .preview-title {
    font-size: 12px;
    color: var(--text-primary);
    margin: 10px 0 0;
    line-height: 1.4;
  }

  .shorts-remove {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: transparent;
    color: var(--text-muted);
    border: none;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    cursor: pointer;
  }
  .shorts-remove:hover { background: var(--danger-bg); color: var(--danger-text); }

  .shorts-empty {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 28px 0;
  }

  .switch { position: relative; width: 30px; height: 17px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; cursor: pointer; inset: 0;
    background: var(--border-strong); border-radius: 20px; transition: 0.2s;
  }
  .switch-track:before {
    content: ""; position: absolute; height: 12px; width: 12px;
    left: 2.5px; bottom: 2.5px; background: #fff; border-radius: 50%; transition: 0.2s;
  }
  .switch input:checked + .switch-track { background: var(--accent); }
  .switch input:checked + .switch-track:before { transform: translateX(13px); }


  /* 모달 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--surface-2);
    border-radius: 12px;
    width: 92%;
    max-width: 520px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 0.5px solid var(--border);
    font-size: 14px;
    font-weight: 500;
  }
  .modal-header button {
    border: none;
    background: none;
    font-size: 16px;
    color: var(--text-muted);
    padding: 0;
  }
  .modal-tabs { display: flex; border-bottom: 0.5px solid var(--border); }
  .modal-tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    font-size: 12px;
    border: none;
    border-radius: 0;
    background: var(--surface-1);
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
  }
  .modal-tab.active {
    background: var(--surface-2);
    color: var(--accent);
    border-bottom: 2px solid var(--accent);
  }
  .modal-body { padding: 16px; overflow-y: auto; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  .modal-search-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .modal-search-row select, .modal-search-row input { flex: 1; margin-bottom: 0; }
  select, input[type="text"] {
    width: 100%;
    font-family: inherit;
    font-size: 12px;
    padding: 7px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
  }

  .import-results { display: flex; flex-direction: column; gap: 6px; }
  .import-result-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 12px;
    cursor: pointer;
    font-size: 12px;
  }
  .import-result-item:hover { border-color: var(--accent); background: var(--accent-bg); }
  .import-empty { text-align: center; color: var(--text-muted); font-size: 12px; padding: 16px 0; }

  .import-pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
  }
  .import-pagination button {
    width: 26px;
    height: 26px;
    padding: 0;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .import-pagination button.active {
    background: var(--text-primary);
    color: #fff;
    border: none;
  }
  .import-pagination button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .keyword-loading { display: none; font-size: 12px; color: var(--text-muted); margin-top: 12px; }
  .keyword-loading.show { display: block; }

  .keyword-results-head {
    display: none;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    margin-bottom: 8px;
  }
  .keyword-results-head.show { display: flex; }
  .keyword-results-head span { font-size: 11px; color: var(--text-muted); }

  .keyword-results-list {
    display: none;
    flex-direction: column;
    gap: 6px;
    max-height: 280px;
    overflow-y: auto;
  }
  .keyword-results-list.show { display: flex; }

  .keyword-candidate {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 12px;
    cursor: pointer;
    font-size: 12px;
  }
  .keyword-candidate:hover { border-color: var(--accent); }
  .keyword-candidate .kc-check {
    width: 15px; height: 15px;
    border-radius: 3px;
    border: 1px solid var(--border-strong);
    flex-shrink: 0;
    margin-left: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    color: transparent;
  }
  .keyword-candidate.selected {
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .keyword-candidate.selected .kc-check {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .modal-footer {
    padding: 12px 16px;
    border-top: 0.5px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text-primary); color: #fff;
    padding: 10px 18px; border-radius: var(--radius); font-size: 13px;
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .card {
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 16px;
    background: var(--surface-2);
  }
  .card-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .card-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .tag-box { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .tag {
    background: var(--accent-bg);
    color: var(--accent);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    display: flex; align-items: center; gap: 4px;
  }
  .tag.tag-danger { background: var(--danger-bg); color: var(--danger-text); }
  .tag button { border: none; background: none; padding: 0; font-size: 11px; color: inherit; line-height: 1; cursor: pointer; }
  .tag-input-row { display: flex; gap: 6px; }
  .tag-input-row input { flex: 1; }

  .bottom-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
  }
  .bottom-actions button { padding: 9px 20px; font-size: 13px; }
</style>
</head>

<!-- 쇼츠 추가 모달 -->
<div class="modal-overlay" id="addModalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <span>쇼츠 추가</span>
      <button id="btnCloseAddModal">×</button>
    </div>
    <div class="modal-tabs">
      <button class="modal-tab active" id="tabAju" data-tab="aju">ABC에서 가져오기</button>
      <button class="modal-tab" id="tabKeyword" data-tab="keyword">키워드</button>
      <button class="modal-tab" id="tabDirect" data-tab="direct">직접입력</button>
    </div>
    <div class="modal-body">

      <div class="tab-pane active" id="paneAju">
        <div class="card-sub" style="margin-bottom:10px;">ABC 채널의 최신 영상을 최신순으로 불러옵니다.</div>

      </div>

      <div class="tab-pane" id="paneKeyword">
        <div class="modal-search-row">
          <input type="text" id="keywordInput" placeholder="예: 반포 자전거, 스마트시티">
          <button id="btnKeywordGenerate">자동 생성</button>
        </div>
        <div class="keyword-loading" id="keywordLoading">쇼츠 후보를 불러오는 중입니다…</div>
        <div class="keyword-results-head" id="keywordResultsHead">
          <span id="keywordResultsCount"></span>
          <button id="btnAddSelectedKeyword" class="primary" style="font-size:11px; padding:5px 10px;">선택한 쇼츠 추가 (0)</button>
        </div>
        <div class="keyword-results-list" id="keywordResultsGrid"></div>
      </div>

      <div class="tab-pane" id="paneDirect">
        <div class="card-sub" style="margin-bottom:10px;">쇼츠 영상 주소(URL)를 직접 입력해 등록합니다.</div>
        <div class="modal-search-row">
          <input type="text" id="directUrlInput" placeholder="https://...">
          <button id="btnDirectAdd" class="primary">추가</button>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="modal-overlay" id="previewModalOverlay">
  <div class="modal-box" style="max-width:280px;">
    <div class="modal-header">
      <span>쇼츠 미리보기</span>
      <button id="btnClosePreviewModal">×</button>
    </div>
    <div class="modal-body" style="padding:16px;">
      <div class="preview-thumb" id="previewThumb"></div>
      <p class="preview-title" id="previewTitle"></p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  var MAX_SHORTS = 10;
  var MIN_SHORTS = 5;
  var shortsList = [
    { title: '서초구 반포바이크 현장 스케치', source: 'aju', exposed: true },
    { title: '스마트시티 예산안 통과 순간', source: 'aju', exposed: true },
    { title: '반포동 주민 인터뷰 모음', source: 'keyword', exposed: true },
    { title: '폭염 속 온열질환 예방법', source: 'keyword', exposed: true },
    { title: '프로야구 순위 경쟁 하이라이트', source: 'aju', exposed: false }
  ];

  var shortsListEl = document.getElementById('shortsListEl');
  var countBadge = document.getElementById('countBadge');
  var warningBanner = document.getElementById('warningBanner');
  var btnAddShorts = document.getElementById('btnAddShorts');
  btnAddShorts.addEventListener('click', openAddModal);

  function renderShorts() {
    shortsListEl.innerHTML = '';

    if (shortsList.length === 0) {
      shortsListEl.innerHTML = '<div class="shorts-empty">등록된 쇼츠가 없습니다. "+ 쇼츠 추가"로 등록해주세요.</div>';
    } else {
      shortsList.forEach(function (s, idx) {
        var row = document.createElement('div');
        row.className = 'shorts-row';
        row.innerHTML =
          '<span class="row-order">' + (idx + 1) + '</span>' +
          '<span class="row-title">' + s.title + '</span>' +
          '<span class="row-right">' +
            '<span class="source-badge ' + s.source + '">' + (s.source === 'aju' ? 'ABC' : s.source === 'direct' ? '직접입력' : '키워드 자동') + '</span>' +
            '<button class="btn-preview" data-idx="' + idx + '">미리보기</button>' +
            '<label class="switch"><input type="checkbox" class="expose-toggle" data-idx="' + idx + '" ' + (s.exposed ? 'checked' : '') + '><span class="switch-track"></span></label>' +
            '<button class="shorts-remove" data-idx="' + idx + '">×</button>' +
          '</span>';
        shortsListEl.appendChild(row);
      });
    }

    btnAddShorts.disabled = shortsList.length >= MAX_SHORTS;

    // 미리보기 버튼
    shortsListEl.querySelectorAll('.btn-preview').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-idx'));
        openPreviewModal(shortsList[idx]);
      });
    });

    // 삭제 버튼
    shortsListEl.querySelectorAll('.shorts-remove').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-idx'));
        var title = shortsList[idx].title;
        shortsList.splice(idx, 1);
        renderShorts();
        showToast('"' + title + '" 쇼츠가 삭제되었습니다');
      });
    });

    // 노출 토글
    shortsListEl.querySelectorAll('.expose-toggle').forEach(function (chk) {
      chk.addEventListener('change', function () {
        var idx = Number(chk.getAttribute('data-idx'));
        shortsList[idx].exposed = chk.checked;
        showToast(chk.checked ? '메인페이지에 노출됩니다' : '메인페이지 노출 해제');
      });
    });

    updateCountBadge();
  }

  function updateCountBadge() {
    var count = shortsList.length;
    countBadge.textContent = count + ' / ' + MAX_SHORTS;
    countBadge.className = 'count-badge';
    if (count >= MIN_SHORTS) {
      countBadge.classList.add('ok');
      warningBanner.classList.remove('show');
    } else {
      countBadge.classList.add('warn');
      warningBanner.textContent = '메인페이지 노출을 위해 최소 ' + MIN_SHORTS + '개가 필요합니다. 현재 ' + (MIN_SHORTS - count) + '개 부족합니다.';
      warningBanner.classList.add('show');
    }
  }

  renderShorts();

  // ── 쇼츠 미리보기 모달 ──
  var previewModalOverlay = document.getElementById('previewModalOverlay');
  document.getElementById('btnClosePreviewModal').addEventListener('click', function () {
    previewModalOverlay.classList.remove('show');
  });
  previewModalOverlay.addEventListener('click', function (e) {
    if (e.target === previewModalOverlay) previewModalOverlay.classList.remove('show');
  });

  function openPreviewModal(shorts) {
    var thumb = document.getElementById('previewThumb');
    var titleEl = document.getElementById('previewTitle');
    var seed = encodeURIComponent(shorts.title).slice(0, 20);
    thumb.style.backgroundImage = 'url(https://picsum.photos/seed/' + seed + '/300/500)';
    thumb.innerHTML = '<span class="play-icon">▶</span>';
    titleEl.textContent = shorts.title;
    previewModalOverlay.classList.add('show');
  }

  // ── 쇼츠 추가 모달 ──
  var addModalOverlay = document.getElementById('addModalOverlay');

  function openAddModal() {
    if (shortsList.length >= MAX_SHORTS) {
      showToast('최대 ' + MAX_SHORTS + '개까지만 등록할 수 있습니다');
      return;
    }
    document.getElementById('keywordInput').value = '';
    document.getElementById('keywordLoading').classList.remove('show');
    document.getElementById('keywordResultsHead').classList.remove('show');
    document.getElementById('keywordResultsGrid').classList.remove('show');
    document.getElementById('keywordResultsGrid').innerHTML = '';
    document.getElementById('directUrlInput').value = '';
    keywordSelectedIdx = {};
    switchTab('aju');
    ajuCurrentPage = 1;
    renderAjuResults();
    addModalOverlay.classList.add('show');
  }

  document.getElementById('btnCloseAddModal').addEventListener('click', function () {
    addModalOverlay.classList.remove('show');
  });
  addModalOverlay.addEventListener('click', function (e) {
    if (e.target === addModalOverlay) addModalOverlay.classList.remove('show');
  });

  function switchTab(tab) {
    document.getElementById('tabAju').classList.toggle('active', tab === 'aju');
    document.getElementById('tabKeyword').classList.toggle('active', tab === 'keyword');
    document.getElementById('tabDirect').classList.toggle('active', tab === 'direct');
    document.getElementById('paneAju').classList.toggle('active', tab === 'aju');
    document.getElementById('paneKeyword').classList.toggle('active', tab === 'keyword');
    document.getElementById('paneDirect').classList.toggle('active', tab === 'direct');
  }
  document.getElementById('tabAju').addEventListener('click', function () { switchTab('aju'); });
  document.getElementById('tabKeyword').addEventListener('click', function () { switchTab('keyword'); });
  document.getElementById('tabDirect').addEventListener('click', function () { switchTab('direct'); });

  // ABC 탭 - 최신순 쇼츠 목록 (데모 샘플, 10건씩 페이징)
  var ajuLatestShorts = [
    '반포바이크 현장 스케치, 출근길 직접 타보니',
    '스마트시티 예산안 통과 순간 영상',
    '반포동 주민들이 말하는 자전거 서비스',
    '폭염 속 온열질환 예방법 30초 요약',
    '프로야구 순위 경쟁 하이라이트 모음',
    '국회 예산안 심사 현장 브리핑',
    '수출 3개월 연속 증가, 현장 반응은',
    '증시 외국인 매수세, 전문가 코멘트',
    '반포한강공원 자전거길 개통 현장',
    '서초구청장 인터뷰, 스마트시티 비전',
    '전기자전거 배터리 안전 점검 영상',
    '반포동 상권 매출 변화 인터뷰',
    '자전거도로 정비 공사 드론 촬영',
    '서울시 자치구 스마트 모빌리티 순위',
    '반포바이크 앱 사용법 30초 가이드',
    '국제 정상회담 현장 하이라이트',
    '해외 특파원이 전하는 베이징 소식',
    '공연 현장 하이라이트, 관객 반응',
    '연예계 이슈 브리핑 영상',
    'AI 스타트업 창업자 인터뷰',
    '재테크 전문가가 말하는 이달의 투자 팁',
    '지역 축제 현장 스케치 영상',
    '학교 급식 현장 점검 리포트',
    '민생 인터뷰, 물가 체감도는',
    '스마트팩토리 견학 현장 영상',
    '반포동 재건축 현장 드론 촬영',
    '서초구 교통사고 감소 통계 브리핑',
    '통학로 자전거도로 안전 점검',
    '서초구 스마트시티 해외 시찰 영상',
    '공유자전거 이용률 지역별 비교',
    '반포바이크 정류소 위치 공개 현장',
    '방배동 자전거 사업 확대 브리핑',
    '서초구의회 조례 개정 현장',
    '반포동 학부모 인터뷰, 통학로 안전'
  ];
  var AJU_PAGE_SIZE = 10;
  var ajuCurrentPage = 1;

  function renderAjuResults() {
    var resultsList = document.getElementById('shortsResultsList');
    var pagination = document.getElementById('shortsResultsPagination');
    var totalPages = Math.ceil(ajuLatestShorts.length / AJU_PAGE_SIZE);
    var startIdx = (ajuCurrentPage - 1) * AJU_PAGE_SIZE;
    var pageItems = ajuLatestShorts.slice(startIdx, startIdx + AJU_PAGE_SIZE);

    resultsList.innerHTML = '';
    pageItems.forEach(function (title) {
      var item = document.createElement('div');
      item.className = 'import-result-item';
      item.innerHTML = '<span>' + title + '</span><span style="color:var(--text-muted); font-size:11px;">추가 ›</span>';
      item.addEventListener('click', function () {
        addShorts(title, 'aju');
      });
      resultsList.appendChild(item);
    });

    pagination.innerHTML = '';
    if (totalPages <= 1) return;

    var prevBtn = document.createElement('button');
    prevBtn.textContent = '‹';
    prevBtn.disabled = ajuCurrentPage === 1;
    prevBtn.addEventListener('click', function () { ajuCurrentPage -= 1; renderAjuResults(); });
    pagination.appendChild(prevBtn);

    for (var p = 1; p <= totalPages; p++) {
      (function (p) {
        var pageBtn = document.createElement('button');
        pageBtn.textContent = String(p);
        if (p === ajuCurrentPage) pageBtn.classList.add('active');
        pageBtn.addEventListener('click', function () { ajuCurrentPage = p; renderAjuResults(); });
        pagination.appendChild(pageBtn);
      })(p);
    }

    var nextBtn = document.createElement('button');
    nextBtn.textContent = '›';
    nextBtn.disabled = ajuCurrentPage === totalPages;
    nextBtn.addEventListener('click', function () { ajuCurrentPage += 1; renderAjuResults(); });
    pagination.appendChild(nextBtn);
  }

  // 키워드 탭 - 자동 생성 데모 (10~20개 후보 생성 후 다중 선택)
  var keywordSelectedIdx = {};

  document.getElementById('btnKeywordGenerate').addEventListener('click', function () {
    var keyword = document.getElementById('keywordInput').value.trim();
    if (keyword === '') {
      showToast('키워드를 입력해주세요');
      return;
    }
    keywordSelectedIdx = {};

    var loading = document.getElementById('keywordLoading');
    var head = document.getElementById('keywordResultsHead');
    var grid = document.getElementById('keywordResultsGrid');
    head.classList.remove('show');
    grid.classList.remove('show');
    grid.innerHTML = '';
    loading.classList.add('show');

    setTimeout(function () {
      loading.classList.remove('show');

      var count = 10 + Math.floor(Math.random() * 11); // 10~20개
      var titleTemplates = [
        '{k} 현장 스케치, 직접 가보니',
        '{k} 이렇게 달라졌다',
        '{k} 하이라이트 모음.zip',
        '{k} 궁금증 30초 정리',
        '{k} 반응 총정리',
        '{k} 여기까지 알아야 함',
        '{k}, 이게 실화라고?',
        '{k} 현장 브리핑 영상',
        '{k} 몰랐던 사실 3가지',
        '{k} 지금 이 정도라니',
        '{k} 요약, 1분이면 충분',
        '{k} 비하인드 스토리',
        '{k} 오늘의 한 장면',
        '{k} 인터뷰 풀버전 하이라이트',
        '{k} 이거 안 보면 손해',
        '{k} 현장 직캠 모음',
        '{k} 전후 비교 영상',
        '{k} 담당자가 말하는 진짜 이유',
        '{k} 시민 반응 인터뷰',
        '{k} 오늘 이슈 총정리'
      ];
      var candidates = [];
      var usedTemplates = titleTemplates.slice();
      for (var i = 0; i < count; i++) {
        if (usedTemplates.length === 0) usedTemplates = titleTemplates.slice();
        var pickIdx = Math.floor(Math.random() * usedTemplates.length);
        var template = usedTemplates.splice(pickIdx, 1)[0];
        candidates.push(template.replace('{k}', keyword));
      }

      grid.innerHTML = '';
      candidates.forEach(function (title, idx) {
        var card = document.createElement('div');
        card.className = 'keyword-candidate';
        card.setAttribute('data-idx', idx);
        card.innerHTML = '<span>' + title + '</span><span class="kc-check">✓</span>';
        card.addEventListener('click', function () {
          if (keywordSelectedIdx[idx]) {
            delete keywordSelectedIdx[idx];
            card.classList.remove('selected');
          } else {
            keywordSelectedIdx[idx] = title;
            card.classList.add('selected');
          }
          updateKeywordSelectionCount();
        });
        grid.appendChild(card);
      });

      document.getElementById('keywordResultsCount').textContent = count + '개 후보 생성됨';
      head.classList.add('show');
      grid.classList.add('show');
      updateKeywordSelectionCount();
    }, 900);
  });

  function updateKeywordSelectionCount() {
    var n = Object.keys(keywordSelectedIdx).length;
    var btn = document.getElementById('btnAddSelectedKeyword');
    btn.textContent = '선택한 쇼츠 추가 (' + n + ')';
    btn.disabled = n === 0;
  }

  document.getElementById('btnAddSelectedKeyword').addEventListener('click', function () {
    var titles = Object.keys(keywordSelectedIdx).map(function (k) { return keywordSelectedIdx[k]; });
    if (titles.length === 0) {
      showToast('먼저 후보를 선택해주세요');
      return;
    }
    var remaining = MAX_SHORTS - shortsList.length;
    if (titles.length > remaining) {
      showToast('최대 ' + MAX_SHORTS + '개까지만 등록할 수 있어 ' + remaining + '개만 추가됩니다');
      titles = titles.slice(0, remaining);
    }
    titles.forEach(function (title) {
      shortsList.push({ title: title, source: 'keyword', exposed: true });
    });
    renderShorts();
    addModalOverlay.classList.remove('show');
    showToast(titles.length + '개의 쇼츠가 추가되었습니다');
  });

  function addShorts(title, source) {
    if (shortsList.length >= MAX_SHORTS) {
      showToast('최대 ' + MAX_SHORTS + '개까지만 등록할 수 있습니다');
      return;
    }
    shortsList.push({ title: title, source: source, exposed: true });
    renderShorts();
    addModalOverlay.classList.remove('show');
    showToast('"' + title + '" 쇼츠가 추가되었습니다');
  }

  // 직접입력 탭 - 쇼츠 주소 직접 추가
  document.getElementById('btnDirectAdd').addEventListener('click', function () {
    var url = document.getElementById('directUrlInput').value.trim();
    if (url === '') {
      showToast('쇼츠 주소를 입력해주세요');
      return;
    }
    if (url.indexOf('http') !== 0) {
      showToast('올바른 URL 형식으로 입력해주세요 (http:// 또는 https://)');
      return;
    }
    addShorts(url, 'direct');
  });

  document.getElementById('btnCancel').addEventListener('click', function () {
    showToast('변경사항이 취소되었습니다');
  });
  document.getElementById('btnRegister').addEventListener('click', function () {
    if (shortsList.length < MIN_SHORTS) {
      showToast('최소 ' + MIN_SHORTS + '개 이상 등록해야 게시할 수 있습니다');
      return;
    }
    showToast('쇼츠 설정이 등록되었습니다');
  });

  document.querySelectorAll('.nav-parent-row').forEach(function (row) {
    row.addEventListener('click', function () {
      var navItem = row.closest('.nav-item');
      var submenu = navItem.querySelector('.submenu');
      var toggleBtn = navItem.querySelector('.nav-toggle');
      submenu.classList.toggle('open');
      toggleBtn.classList.toggle('open');
    });
  });
</script>

</body>
</html>
