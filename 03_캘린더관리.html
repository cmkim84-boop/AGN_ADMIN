<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아주경제 부산 관리페이지 - 캘린더 관리</title>
<style>
  :root {
    --border: #e2e0d8;
    --border-strong: #c8c5ba;
    --text-primary: #1c1c1a;
    --text-secondary: #5f5e5a;
    --text-muted: #96948a;
    --surface-1: #f6f5f0;
    --surface-2: #ffffff;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --success-bg: #eaf3de;
    --success-text: #3b6d11;
    --amber-bg: #faeeda;
    --amber-text: #854f0b;
    --danger-bg: #fcebeb;
    --danger-text: #a32d2d;
    --radius: 8px;

    --shell-bg: #333b49;
    --shell-bg-active: #262c38;
    --shell-text-muted: #9298a5;
    --shell-border: #454d5c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--surface-2);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--shell-bg);
    color: #fff;
    padding: 0 24px;
    height: 56px;
    flex-shrink: 0;
  }
  .app-header .brand { display: flex; align-items: center; gap: 12px; }
  .app-header .brand .logo { font-size: 19px; font-weight: 800; letter-spacing: 0.5px; }
  .app-header .brand .divider { color: var(--shell-text-muted); font-size: 14px; }
  .app-header .brand .label { font-size: 14px; color: #fff; }
  .app-header .account { display: flex; align-items: center; gap: 10px; }
  .app-header .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #7b8291;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px;
  }
  .app-header .account-name { font-size: 13px; font-weight: 600; }
  .app-header .btn-logout {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.5);
    color: #fff;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 4px;
  }
  .app-header .btn-logout:hover { background: rgba(255,255,255,0.1); }

  .app-body { display: flex; flex: 1; }

  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--shell-bg);
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    padding: 22px 20px;
    text-align: center;
    border-bottom: 0.5px solid var(--shell-border);
  }
  .sidebar-header .site-name { color: #fff; font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .sidebar-header .sub-label {
    color: var(--shell-text-muted);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .sidebar-nav { display: flex; flex-direction: column; }
  .sidebar-nav a {
    display: block;
    padding: 16px 20px;
    text-align: center;
    font-size: 13px;
    color: var(--shell-text-muted);
    text-decoration: none;
    border-bottom: 0.5px solid var(--shell-border);
  }
  .sidebar-nav a:hover { color: #fff; }
  .sidebar-nav a.active {
    background: var(--shell-bg-active);
    color: #fff;
    font-weight: 700;
  }

  .main-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .main-content {
    flex: 1;
    padding: 24px 24px 24px 50px;
  }
  .content-inner { max-width: 1200px; margin: 0; }

  .app-footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    padding: 16px 0;
    border-top: 0.5px solid var(--border);
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .topbar-actions { display: flex; gap: 8px; }
  .topbar h1 { font-size: 22px; font-weight: 700; margin: 0; }

  .filter-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    padding: 10px 12px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-1);
  }

  button {
    font-family: inherit;
    font-size: 13px;
    border-radius: var(--radius);
    padding: 9px 16px;
    cursor: pointer;
    border: 0.5px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-secondary);
  }
  button:hover { background: var(--surface-1); }
  button.primary { background: var(--text-primary); color: #fff; border: none; }
  button.primary:hover { background: #333; }
  button:disabled { opacity: 0.3; cursor: not-allowed; }

  select {
    font-family: inherit;
    font-size: 12px;
    padding: 7px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    background: var(--surface-2);
  }

  .table-wrap {
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  thead tr { background: var(--surface-1); text-align: left; }
  th { padding: 10px 10px; font-weight: 500; color: var(--text-secondary); font-size: 12px; }
  td { padding: 10px 10px; border-top: 0.5px solid var(--border); vertical-align: middle; }

  th.col-no, td.col-no { width: 48px; text-align: center; color: var(--text-muted); }
  th.col-date, td.col-date { width: 170px; color: var(--text-secondary); }
  th.col-content, td.col-content { }
  th.col-onoff, td.col-onoff { width: 70px; text-align: center; }
  th.col-created, td.col-created { width: 140px; color: var(--text-muted); font-size: 12px; }
  th.col-del, td.col-del { width: 110px; text-align: center; }

  .content-cell {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
    max-width: 100%;
    flex: 1;
    min-width: 0;
  }
  .content-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .article-link-icon {
    flex-shrink: 0;
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 2px 7px;
    border-radius: 10px;
    text-decoration: none;
    white-space: nowrap;
  }
  .article-link-icon:hover { text-decoration: underline; }

  .badge { font-size: 11px; padding: 2px 9px; border-radius: 12px; white-space: nowrap; }
  .badge.on { background: var(--success-bg); color: var(--success-text); }
  .badge.off { background: var(--surface-1); color: var(--text-muted); border: 0.5px solid var(--border); }

  .switch { position: relative; width: 30px; height: 17px; display: inline-block; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; cursor: pointer; inset: 0;
    background: var(--border-strong); border-radius: 20px; transition: 0.2s;
  }
  .switch-track:before {
    content: ""; position: absolute; height: 12px; width: 12px;
    left: 2.5px; bottom: 2.5px; background: #fff; border-radius: 50%; transition: 0.2s;
  }
  .switch input:checked + .switch-track { background: var(--accent); }
  .switch input:checked + .switch-track:before { transform: translateX(13px); }

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
  }
  .pagination button {
    width: 28px;
    height: 28px;
    padding: 0;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .pagination button.active {
    background: var(--text-primary);
    color: #fff;
    border: none;
  }
  .pagination button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .btn-delete {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: transparent;
    color: var(--text-muted);
    border: none;
    font-size: 14px;
    padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn-delete:hover { background: var(--danger-bg); color: var(--danger-text); }

  .row-actions { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-edit {
    font-size: 11px;
    padding: 4px 10px;
    color: var(--text-secondary);
  }
  .btn-edit:hover { border-color: var(--accent); color: var(--accent); }

  .empty-row td { text-align: center; color: var(--text-muted); padding: 24px 0; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--surface-2);
    border-radius: 12px;
    width: 92%;
    max-width: 480px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 0.5px solid var(--border);
    font-size: 14px;
    font-weight: 500;
  }
  .modal-header button {
    border: none;
    background: none;
    font-size: 16px;
    color: var(--text-muted);
    padding: 0;
    cursor: pointer;
  }
  .modal-body { padding: 16px; overflow-y: auto; }
  .modal-footer {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-top: 0.5px solid var(--border);
    gap: 8px;
  }
  .modal-select-row { display: flex; gap: 8px; margin-bottom: 4px; }
  .modal-select-row select { flex: 1; }
  .modal-sub-text { font-size: 12px; color: var(--text-muted); margin: 8px 0 0; }

  .ai-loading { text-align: center; font-size: 12px; color: var(--text-muted); padding: 20px 0; display: none; }
  .ai-loading.show { display: block; }

  .ai-candidates { display: none; flex-direction: column; gap: 6px; }
  .ai-candidates.show { display: flex; }
  .ai-candidate-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    cursor: pointer;
  }
  .ai-candidate-item:hover { border-color: var(--accent); background: var(--accent-bg); }
  .ai-candidate-item input { margin-top: 3px; }
  .ai-candidate-item .ac-body { flex: 1; min-width: 0; }
  .ai-candidate-item .ac-title { font-size: 13px; color: var(--text-primary); margin-bottom: 3px; }
  .ai-candidate-item .ac-meta { font-size: 11px; color: var(--text-muted); }
  .ai-candidate-item .ac-source {
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 10px;
    background: var(--accent-bg);
    color: var(--accent);
    margin-left: 6px;
  }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text-primary); color: #fff;
    padding: 10px 18px; border-radius: var(--radius); font-size: 13px;
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="logo">AGN</span>
    <span class="divider">|</span>
    <span class="label">관리페이지</span>
  </div>
  <div class="account">
    <span class="avatar">👤</span>
    <span class="account-name">신동규 기자</span>
    <button class="btn-logout">로그아웃</button>
  </div>
</header>

<div class="app-body">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="site-name">아주경제 부산</div>
      <div class="sub-label">⚙ 관리페이지</div>
    </div>
    <nav class="sidebar-nav">
      <a href="#">기본관리</a>
      <a href="00_기사리스트.html">뉴스관리</a>
      <a href="02_쇼츠등록.html">쇼츠관리</a>
      <a href="03_캘린더관리.html" class="active">캘린더관리</a>
      <a href="#">기자관리</a>
      <a href="#">광고관리</a>
      <a href="#">디자인관리</a>
    </nav>
  </aside>

  <div class="main-column">
    <main class="main-content">
      <div class="content-inner">

        <div class="topbar">
          <h1>캘린더 관리</h1>
          <div class="topbar-actions">
            <button id="btnAiAddCalendar">✦ AI 캘린더 추가</button>
            <button class="primary" id="btnAddCalendar">+ 추가</button>
          </div>
        </div>

        <div class="filter-bar">
          <select id="yearSelect"></select>
          <select id="monthSelect">
            <option value="all">전체 월</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="col-no">NO</th>
                <th class="col-date">날짜</th>
                <th class="col-content">행사내용</th>
                <th class="col-onoff">노출</th>
                <th class="col-created">등록일</th>
                <th class="col-del">관리</th>
              </tr>
            </thead>
            <tbody id="calendarTableBody"></tbody>
          </table>
        </div>

        <div class="pagination" id="calendarPagination"></div>

      </div>
    </main>
    <footer class="app-footer">Copyright ⓒ 아주경제 All rights reserved.</footer>
  </div>

</div>

<div class="modal-overlay" id="aiModalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <span>AI 캘린더 추가</span>
      <button id="btnCloseAiModal">×</button>
    </div>
    <div class="modal-body">

      <div id="aiSelectPane">
        <div class="modal-select-row">
          <select id="aiYearSelect"></select>
          <select id="aiMonthSelect"></select>
        </div>
        <div class="modal-sub-text">선택한 연월에 해당하는 지역 행사를 AI가 찾아 후보로 보여드립니다.</div>
      </div>

      <div class="ai-loading" id="aiLoading">해당 연월의 행사를 검색하는 중입니다…</div>

      <div class="ai-candidates" id="aiCandidates"></div>

    </div>
    <div class="modal-footer" id="aiFooterSelect">
      <button class="primary" id="btnAiSearch" style="margin-left:auto;">행사 찾기</button>
    </div>
    <div class="modal-footer" id="aiFooterResult" style="display:none;">
      <span id="aiSelectedCount" style="font-size:11px; color:var(--text-muted); margin-right:auto;">0개 선택됨</span>
      <button id="btnAiBack">다시 검색</button>
      <button class="primary" id="btnAiRegister">선택 항목 일괄등록</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  document.getElementById('btnAddCalendar').addEventListener('click', function () {
    window.location.href = '04_캘린더추가.html';
  });

  function fmtCreated(daysAgo) {
    var d = new Date();
    d.setDate(d.getDate() - daysAgo);
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate());
  }

  var eventPool = [
    '서초구 스마트시티 컨퍼런스',
    '반포한강공원 벚꽃축제',
    '지역경제 활성화 토론회',
    '자전거 안전교육 캠페인',
    '아주경제 부산 창간기념 행사',
    '지자체의회 정기회의',
    '스타트업 데모데이',
    '반포동 주민 화합 한마당',
    '교통정책 공청회',
    '중소상공인 지원 설명회',
    '지역 문화예술 축제',
    '스마트 모빌리티 박람회',
    '청년 취업박람회',
    '환경의 날 기념행사',
    '지역 신문의 날 기념식',
    '자원봉사자의 날 행사',
    '반포바이크 1주년 기념식',
    '서초구청 온라인 시민 설명회',
    '지역 스포츠 대축전',
    '연말 불우이웃 돕기 행사'
  ];

  var TOTAL_EVENTS = 26;
  var calendarEvents = [];
  var now = new Date();
  for (var i = 0; i < TOTAL_EVENTS; i++) {
    var monthOffset = i % 14; // 최근 ~14개월에 걸쳐 분산
    var startD = new Date(now.getFullYear(), now.getMonth() - monthOffset, 5 + (i % 20));
    var pad = function (n) { return String(n).padStart(2, '0'); };
    var toStr = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

    var isMultiDay = i % 4 === 0; // 4개 중 1개꼴로 여러 날짜에 걸친 행사
    var endD = new Date(startD);
    if (isMultiDay) {
      endD.setDate(endD.getDate() + 1 + (i % 4)); // 2~5일짜리 행사
    }

    calendarEvents.push({
      startDate: toStr(startD),
      endDate: toStr(endD),
      content: eventPool[i % eventPool.length],
      exposed: i % 3 !== 0,
      createdAt: fmtCreated(monthOffset * 30 + (i % 5)),
      articleUrl: (i % 5 === 0) ? 'https://www.ajunews.com/view/example-' + (i + 1) : ''
    });
  }
  // 최신 시작일순 정렬
  calendarEvents.sort(function (a, b) { return new Date(b.startDate) - new Date(a.startDate); });

  var yearSelect = document.getElementById('yearSelect');
  var monthSelect = document.getElementById('monthSelect');

  var years = Array.from(new Set(calendarEvents.map(function (e) { return e.startDate.slice(0, 4); }))).sort().reverse();
  yearSelect.innerHTML = '<option value="all">전체 연도</option>' +
    years.map(function (y) { return '<option value="' + y + '">' + y + '년</option>'; }).join('');

  for (var m = 1; m <= 12; m++) {
    var opt = document.createElement('option');
    opt.value = String(m);
    opt.textContent = m + '월';
    monthSelect.appendChild(opt);
  }

  var PAGE_SIZE = 10;
  var currentPage = 1;

  yearSelect.addEventListener('change', function () { currentPage = 1; renderCalendar(); });
  monthSelect.addEventListener('change', function () { currentPage = 1; renderCalendar(); });

  var tbody = document.getElementById('calendarTableBody');

  function formatDateCell(e) {
    return e.startDate === e.endDate ? e.startDate : (e.startDate + ' ~ ' + e.endDate);
  }

  function eventInYearMonth(e, year, month) {
    // 시작일~종료일 사이에 선택한 연/월에 해당하는 날짜가 하나라도 포함되면 매치
    var start = new Date(e.startDate);
    var end = new Date(e.endDate);
    for (var d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      var y = String(d.getFullYear());
      var mo = String(d.getMonth() + 1);
      if ((year === 'all' || y === year) && (month === 'all' || mo === month)) return true;
    }
    return false;
  }

  function renderCalendar() {
    var year = yearSelect.value;
    var month = monthSelect.value;

    var filtered = calendarEvents.filter(function (e) {
      return eventInYearMonth(e, year, month);
    });

    tbody.innerHTML = '';
    var paginationEl = document.getElementById('calendarPagination');

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="6">조건에 맞는 일정이 없습니다</td></tr>';
      paginationEl.innerHTML = '';
      return;
    }

    var totalPages = Math.ceil(filtered.length / PAGE_SIZE);
    if (currentPage > totalPages) currentPage = totalPages;
    var startIdx = (currentPage - 1) * PAGE_SIZE;
    var pageItems = filtered.slice(startIdx, startIdx + PAGE_SIZE);

    pageItems.forEach(function (e, i) {
      var idx = startIdx + i;
      var realIdx = calendarEvents.indexOf(e);
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="col-no">' + (idx + 1) + '</td>' +
        '<td class="col-date">' + formatDateCell(e) + '</td>' +
        '<td class="col-content"><div class="content-row"><span class="content-cell">' + e.content + '</span>' + (e.articleUrl ? '<a class="article-link-icon" href="' + e.articleUrl + '" target="_blank" rel="noopener" title="관련 기사 보기">🔗 기사</a>' : '') + '</div></td>' +
        '<td class="col-onoff"><label class="switch"><input type="checkbox" class="expose-toggle" data-idx="' + realIdx + '" ' + (e.exposed ? 'checked' : '') + '><span class="switch-track"></span></label></td>' +
        '<td class="col-created">' + e.createdAt + '</td>' +
        '<td class="col-del"><div class="row-actions"><button class="btn-edit" data-idx="' + realIdx + '">수정</button><button class="btn-delete" data-idx="' + realIdx + '">×</button></div></td>';
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll('.expose-toggle').forEach(function (chk) {
      chk.addEventListener('change', function () {
        var idx = Number(chk.getAttribute('data-idx'));
        calendarEvents[idx].exposed = chk.checked;
        showToast(chk.checked ? '메인페이지에 노출됩니다' : '메인페이지 노출 해제');
      });
    });

    tbody.querySelectorAll('.btn-edit').forEach(function (btn) {
      btn.addEventListener('click', function () {
        window.location.href = '05_캘린더수정.html';
      });
    });

    tbody.querySelectorAll('.btn-delete').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = Number(btn.getAttribute('data-idx'));
        var content = calendarEvents[idx].content;
        calendarEvents.splice(idx, 1);
        renderCalendar();
        showToast('"' + content + '" 일정이 삭제되었습니다');
      });
    });

    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    var pagination = document.getElementById('calendarPagination');
    pagination.innerHTML = '';
    if (totalPages <= 1) return;

    var prevBtn = document.createElement('button');
    prevBtn.textContent = '‹';
    prevBtn.disabled = currentPage === 1;
    prevBtn.addEventListener('click', function () { currentPage -= 1; renderCalendar(); });
    pagination.appendChild(prevBtn);

    for (var p = 1; p <= totalPages; p++) {
      (function (p) {
        var pageBtn = document.createElement('button');
        pageBtn.textContent = String(p);
        if (p === currentPage) pageBtn.classList.add('active');
        pageBtn.addEventListener('click', function () { currentPage = p; renderCalendar(); });
        pagination.appendChild(pageBtn);
      })(p);
    }

    var nextBtn = document.createElement('button');
    nextBtn.textContent = '›';
    nextBtn.disabled = currentPage === totalPages;
    nextBtn.addEventListener('click', function () { currentPage += 1; renderCalendar(); });
    pagination.appendChild(nextBtn);
  }

  renderCalendar();

  // ── AI 캘린더 추가 ──
  var aiModalOverlay = document.getElementById('aiModalOverlay');
  var aiYearSelect = document.getElementById('aiYearSelect');
  var aiMonthSelect = document.getElementById('aiMonthSelect');
  var aiSelectPane = document.getElementById('aiSelectPane');
  var aiLoading = document.getElementById('aiLoading');
  var aiCandidatesEl = document.getElementById('aiCandidates');
  var aiFooterSelect = document.getElementById('aiFooterSelect');
  var aiFooterResult = document.getElementById('aiFooterResult');

  var thisYear = new Date().getFullYear();
  var aiYearOptions = [thisYear - 1, thisYear, thisYear + 1];
  aiYearSelect.innerHTML = aiYearOptions.map(function (y) { return '<option value="' + y + '">' + y + '년</option>'; }).join('');
  aiYearSelect.value = String(thisYear);

  for (var am = 1; am <= 12; am++) {
    var amOpt = document.createElement('option');
    amOpt.value = String(am);
    amOpt.textContent = am + '월';
    aiMonthSelect.appendChild(amOpt);
  }
  aiMonthSelect.value = String(new Date().getMonth() + 1);

  var aiCandidatesData = [];
  var aiSelectedSet = {};

  document.getElementById('btnAiAddCalendar').addEventListener('click', function () {
    resetAiModal();
    aiModalOverlay.classList.add('show');
  });
  document.getElementById('btnCloseAiModal').addEventListener('click', function () {
    aiModalOverlay.classList.remove('show');
  });
  aiModalOverlay.addEventListener('click', function (e) {
    if (e.target === aiModalOverlay) aiModalOverlay.classList.remove('show');
  });

  function resetAiModal() {
    aiSelectPane.style.display = 'block';
    aiLoading.classList.remove('show');
    aiCandidatesEl.classList.remove('show');
    aiCandidatesEl.innerHTML = '';
    aiFooterSelect.style.display = 'flex';
    aiFooterResult.style.display = 'none';
    aiSelectedSet = {};
  }

  document.getElementById('btnAiBack').addEventListener('click', resetAiModal);

  var aiEventPool = ['지역 문화축제', '전통시장 활성화 행사', '어린이날 기념 행사', '지자체 정기 설명회', '주민 참여 토론회', '환경 정화 캠페인', '청년 창업 박람회', '반려동물 축제', '지역 도서관 북페스티벌', '노인 일자리 박람회'];

  function generateAiCandidates(year, month) {
    var count = 4 + Math.floor(Math.random() * 3); // 4~6개
    var pad = function (n) { return String(n).padStart(2, '0'); };
    var list = [];
    for (var i = 0; i < count; i++) {
      var day = 3 + ((i * 5) % 25);
      list.push({
        title: aiEventPool[(i + Number(month)) % aiEventPool.length],
        date: year + '-' + pad(Number(month)) + '-' + pad(day),
        source: (i % 2 === 0) ? '공공데이터' : '웹검색'
      });
    }
    return list;
  }

  document.getElementById('btnAiSearch').addEventListener('click', function () {
    aiSelectPane.style.display = 'none';
    aiLoading.classList.add('show');
    aiFooterSelect.style.display = 'none';

    setTimeout(function () {
      aiLoading.classList.remove('show');
      aiCandidatesData = generateAiCandidates(aiYearSelect.value, aiMonthSelect.value);
      renderAiCandidates();
      aiCandidatesEl.classList.add('show');
      aiFooterResult.style.display = 'flex';
    }, 900);
  });

  function renderAiCandidates() {
    aiCandidatesEl.innerHTML = '';
    aiCandidatesData.forEach(function (c, idx) {
      var item = document.createElement('label');
      item.className = 'ai-candidate-item';
      item.innerHTML =
        '<input type="checkbox" data-idx="' + idx + '">' +
        '<div class="ac-body">' +
          '<div class="ac-title">' + c.title + '<span class="ac-source">' + c.source + '</span></div>' +
          '<div class="ac-meta">' + c.date + '</div>' +
        '</div>';
      aiCandidatesEl.appendChild(item);
    });

    aiCandidatesEl.querySelectorAll('input[type="checkbox"]').forEach(function (chk) {
      chk.addEventListener('change', function () {
        var idx = Number(chk.getAttribute('data-idx'));
        if (chk.checked) {
          aiSelectedSet[idx] = true;
        } else {
          delete aiSelectedSet[idx];
        }
        updateAiSelectedCount();
      });
    });
    updateAiSelectedCount();
  }

  function updateAiSelectedCount() {
    document.getElementById('aiSelectedCount').textContent = Object.keys(aiSelectedSet).length + '개 선택됨';
  }

  document.getElementById('btnAiRegister').addEventListener('click', function () {
    var indices = Object.keys(aiSelectedSet);
    if (indices.length === 0) {
      showToast('등록할 항목을 선택해주세요');
      return;
    }
    var today = fmtCreated(0);
    indices.forEach(function (idxStr) {
      var c = aiCandidatesData[Number(idxStr)];
      calendarEvents.push({
        startDate: c.date,
        endDate: c.date,
        content: c.title,
        exposed: true,
        createdAt: today,
        articleUrl: ''
      });
    });
    calendarEvents.sort(function (a, b) { return new Date(b.startDate) - new Date(a.startDate); });
    aiModalOverlay.classList.remove('show');
    currentPage = 1;
    renderCalendar();
    showToast(indices.length + '개의 일정이 AI로 등록되었습니다');
  });
</script>

</body>
</html>
